<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium IPTV - FIFA+ Player</title>
    <!-- Firebase Core Services -->
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <!-- Advanced HLS Dynamic Engine -->
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --primary: #e50914;
            --bg-dark: #09090b;
            --bg-panel: #141416;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border-color: #27272a;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-main); min-height: 100vh; overflow-x: hidden; }
        .hidden { display: none !important; }

        .app-container { display: flex; flex-direction: column; width: 100vw; height: 100vh; }
        
        /* Navbar Layout */
        .navbar { display: flex; justify-content: space-between; align-items: center; background: var(--bg-panel); padding: 12px 24px; border-bottom: 1px solid var(--border-color); flex-shrink: 0; }
        .navbar h3 { font-size: 18px; color: var(--primary); font-weight: 700; display: flex; align-items: center; gap: 10px; }
        .nav-right-zone { display: flex; align-items: center; gap: 15px; }

        .profile-trigger-btn { width: 38px; height: 38px; border-radius: 50%; border: 2px solid var(--primary); background: #27272a; cursor: pointer; overflow: hidden; display: flex; align-items: center; justify-content: center; transition: 0.3s; box-shadow: 0 0 10px rgba(229, 9, 20, 0.3); }
        .profile-trigger-btn:hover { transform: scale(1.08); box-shadow: 0 0 15px rgba(229, 9, 20, 0.6); }
        .profile-trigger-btn img { width: 100%; height: 100%; object-fit: cover; }

        /* Workspace Grid Frame */
        .main-content { display: flex; flex-direction: column; flex: 1; overflow-y: auto; padding: 15px; gap: 15px; align-items: center; width: 100%; }
        
        /* THEATER PLAYER STUDIO */
        .player-panel { width: 100%; max-width: 1280px; display: flex; flex-direction: column; align-items: center; position: relative; }
        
        /* Interactive Video Wrapper */
        .video-wrapper { 
            width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 14px; 
            overflow: hidden; box-shadow: 0 30px 60px rgba(0,0,0,0.9); border: 1px solid #232326; 
            display: flex; flex-direction: column; justify-content: space-between; position: relative; 
            transition: cursor 0.3s;
        }
        
        @media (max-width: 768px) {
            .video-wrapper { aspect-ratio: 16/10; border-radius: 8px; }
            .main-content { padding: 8px; }
        }
        
        .video-wrapper.hide-ui { cursor: none; }
        
        video { width: 100%; height: 100%; background: #000; object-fit: cover; display: block; position: absolute; top: 0; left: 0; z-index: 1; } 
        
        /* OVERLAY INTERFACES */
        .server-overlay-zone, .player-controls-bar {
            position: absolute; left: 0; width: 100%; z-index: 10;
            transition: transform 0.4s cubic-bezier(0.25, 1, 0.5, 1), opacity 0.4s ease;
            opacity: 0; pointer-events: none;
        }

        /* Server top overlay slider */
        .server-overlay-zone {
            top: 0; padding: 16px 20px; display: flex; justify-content: center; gap: 15px; flex-wrap: wrap;
            transform: translateY(-100%);
            background: linear-gradient(to bottom, rgba(0,0,0,0.6) 0%, rgba(0,0,0,0) 100%);
        }
        
        .player-controls-bar {
            bottom: 0; height: 55px; display: flex; justify-content: space-between; 
            align-items: center; background: linear-gradient(to top, rgba(0,0,0,0.85) 60%, rgba(0,0,0,0) 100%); 
            padding: 0 24px; transform: translateY(100%);
        }

        .video-wrapper.show-ui .server-overlay-zone { transform: translateY(0); opacity: 1; pointer-events: auto; }
        .video-wrapper.show-ui .player-controls-bar { transform: translateY(0); opacity: 1; pointer-events: auto; }

        /* SERVER CARDS (No Blur - Solid look) */
        .server-card-node {
            flex: 1; min-width: 140px; max-width: 220px; display: flex; align-items: center; 
            padding: 8px 14px; 
            background: rgba(14, 14, 16, 0.75); 
            backdrop-filter: none !important; -webkit-backdrop-filter: none !important; 
            border: 1.5px solid rgba(255, 255, 255, 0.15); border-radius: 10px; 
            cursor: pointer; transition: all 0.25s ease;
        }
        .server-card-node:hover { border-color: rgba(255,255,255,0.35); background: rgba(255,255,255,0.08); }
        .server-card-node.active { border-color: var(--primary); background: rgba(229, 9, 20, 0.25); box-shadow: 0 0 15px rgba(229,9,20,0.3); }

        .server-icon-frame { width: 32px; height: 32px; border-radius: 6px; background: rgba(229, 9, 20, 0.95); display: flex; align-items: center; justify-content: center; margin-right: 12px; font-weight: bold; color: #fff; font-size: 13px; flex-shrink: 0; }
        .server-meta { display: flex; flex-direction: column; overflow: hidden; }
        .server-title { font-size: 13px; font-weight: 700; color: #fff; text-overflow: ellipsis; white-space: nowrap; overflow: hidden; }
        .server-status { font-size: 11px; color: #2ecc71; font-weight: 600; display: flex; align-items: center; gap: 4px; }

        .controls-left, .controls-right { display: flex; align-items: center; gap: 18px; }
        .control-btn { background: none; border: none; color: var(--text-main); font-size: 18px; cursor: pointer; transition: 0.2s; }
        .control-btn:hover { color: var(--primary); }
        .live-badge { display: flex; align-items: center; gap: 6px; background: rgba(229, 9, 20, 0.3); color: #ff3838; font-size: 11px; font-weight: 800; padding: 5px 12px; border-radius: 5px; letter-spacing: 0.5px; text-transform: uppercase; }
        .live-dot { width: 7px; height: 7px; background: #ff3838; border-radius: 50%; animation: blink 1s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
        .volume-slider { width: 90px; accent-color: var(--primary); height: 4px; border-radius: 2px; cursor: pointer; }
        
        .playing-bar { width: 100%; padding: 12px 20px; background: var(--bg-panel); border-radius: 8px; border: 1px solid #232326; font-weight: 600; display: flex; align-items: center; gap: 10px; margin-top: 10px; }

        /* PROFILE MODAL POPUP DASHBOARD (Styled based on image_6e1542.png specs) */
        .profile-modal-overlay { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 0, 0, 0.85); display: flex; justify-content: center; align-items: center; z-index: 9999; animation: fadeIn 0.3s ease; }
        .profile-card { background: #141416; border: 1px solid #232326; width: 350px; border-radius: 16px; padding: 30px 24px; text-align: center; position: relative; box-shadow: 0 25px 50px rgba(0,0,0,0.8); }
        .close-modal-btn { position: absolute; top: 16px; right: 18px; background: none; border: none; color: var(--text-muted); font-size: 20px; cursor: pointer; transition: 0.2s; }
        .close-modal-btn:hover { color: #fff; transform: scale(1.1); }
        
        .card-avatar { width: 110px; height: 110px; border-radius: 50%; border: 3px solid var(--primary); margin: 0 auto 20px auto; overflow: hidden; background: #1e1e24; box-shadow: 0 0 15px rgba(229, 9, 20, 0.4); }
        .card-avatar img { width: 100%; height: 100%; object-fit: cover; }
        
        .card-name { font-size: 22px; font-weight: 800; text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 4px; color: #fff; }
        .card-sub { font-size: 13px; color: var(--primary); font-weight: 700; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 25px; }
        
        .social-links-container { display: flex; flex-direction: column; gap: 12px; width: 100%; }
        .social-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 14px; border-radius: 10px; border: none; font-size: 15px; font-weight: 700; text-decoration: none; color: #fff; transition: all 0.25s ease; }
        .btn-facebook { background: #1877f2; } .btn-facebook:hover { background: #145dbd; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(24,119,242,0.4); }
        .btn-whatsapp { background: #12d261; } .btn-whatsapp:hover { background: #0ea64d; transform: translateY(-2px); box-shadow: 0 5px 15px rgba(18,210,97,0.4); }

        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .loading-screen { position: fixed; top:0; left:0; width:100%; height:100%; background: var(--bg-dark); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 99999; }
    </style>
</head>
<body>

    <div id="loadingOverlay" class="loading-screen">
        <i class="fa-solid fa-circle-notch fa-spin" style="font-size: 45px; color: var(--primary); margin-bottom: 20px;"></i>
        <h2>Booting Database Configuration Matrix...</h2>
    </div>

    <!-- PROFILE MODAL DASHBOARD (Auto Opens on Launch) -->
    <div id="profileModal" class="profile-modal-overlay">
        <div class="profile-card">
            <button class="close-modal-btn" onclick="toggleProfileModal()"><i class="fa-solid fa-xmark"></i></button>
            <div class="card-avatar">
                <img id="usrCardImg" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Avatar">
            </div>
            <div class="card-name" id="usrCardName">FOV HRIDOY</div>
            <div class="card-sub" id="usrCardBio">WELCOME</div>
            
            <div class="social-links-container">
                <a id="usrFbLink" href="#" target="_blank" class="social-btn btn-facebook">
                    <i class="fa-brands fa-facebook-f"></i> Facebook Profile
                </a>
                <a id="usrWaLink" href="#" target="_blank" class="social-btn btn-whatsapp">
                    <i class="fa-brands fa-whatsapp"></i> Contact WhatsApp
                </a>
            </div>
        </div>
    </div>

    <div class="app-container">
        <!-- Navbar -->
        <div class="navbar">
            <h3><i class="fa-solid fa-satellite-dish"></i> FIFA+ Cloud Player</h3>
            <div class="nav-right-zone">
                <span style="font-size: 13px; color: var(--text-muted);"><i class="fa-solid fa-shield-halved" style="color: #2ecc71;"></i> Matrix Stabilized</span>
                <button class="profile-trigger-btn" onclick="toggleProfileModal()">
                    <img id="navAvatarImg" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" alt="Profile">
                </button>
            </div>
        </div>

        <div class="main-content">
            <div class="player-panel">
                <!-- Video Core Wrapper Trigger -->
                <div id="videoContainer" class="video-wrapper show-ui" onclick="toggleMobileOverlay(event)" ondblclick="handlePlayerDoubleClick(event)">
                    
                    <!-- Transparent Top Bar Servers -->
                    <div class="server-overlay-zone" id="serverOverlay"></div>

                    <!-- Direct Video Engine Render -->
                    <video id="hlsPlayer" autoplay playsinline muted></video>
                    
                    <!-- Player Controls Bar Component -->
                    <div class="player-controls-bar" onclick="event.stopPropagation();" ondblclick="event.stopPropagation();">
                        <div class="controls-left"><div class="live-badge"><span class="live-dot"></span>LIVE</div></div>
                        <div class="controls-right">
                            <button class="control-btn" id="muteBtn" onclick="toggleMute(event)"><i class="fa-solid fa-volume-xmark"></i></button>
                            <input type="range" class="volume-slider" id="volumeSlider" min="0" max="1" step="0.1" value="0" oninput="changeVolume(this.value)" onclick="event.stopPropagation()">
                            <button class="control-btn" onclick="toggleFullScreen(event)"><i class="fa-solid fa-expand"></i></button>
                        </div>
                    </div>
                </div>
                
                <div id="playingBar" class="playing-bar">
                    <i class="fa-solid fa-play-circle" style="color: var(--primary); font-size:18px;"></i>
                    <span id="playingTitle" style="color:var(--text-main)">Loading Default Server Stream...</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyC8KiPISiDtpT0_vsL1HRF_oZwiqPExse0",
            authDomain: "ff-tournament-efff1.firebaseapp.com",
            databaseURL: "https://ff-tournament-efff1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "ff-tournament-efff1",
            storageBucket: "ff-tournament-efff1.firebasestorage.app",
            messagingSenderId: "173129228294",
            appId: "1:173129228294:web:9d318f114ca09c65b36387",
            measurementId: "G-SLTDVQPDTX"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let host = "", user = "", pass = "";
        let hlsInstance = null;
        let inactivityTimeout = null;
        const wrapper = document.getElementById('videoContainer');

        window.addEventListener('DOMContentLoaded', () => {
            database.ref('iptv_config').on('value', (snapshot) => {
                const data = snapshot.val();
                if(data) {
                    host = data.host || ""; 
                    user = data.username || ""; 
                    pass = data.password || "";
                    document.getElementById('loadingOverlay').classList.add('hidden');
                    if (host && user && pass) { loadChannelsAndAutoPlay(); }
                } else {
                    document.getElementById('loadingOverlay').classList.add('hidden');
                }
            });

            database.ref('admin_profile').on('value', (snapshot) => {
                const profile = snapshot.val();
                if(profile) {
                    document.getElementById('usrCardName').innerText = profile.name || "FOV HRIDOY";
                    document.getElementById('usrCardBio').innerText = profile.bio || "WELCOME";
                    document.getElementById('usrFbLink').href = profile.facebook || "#";
                    document.getElementById('usrWaLink').href = profile.whatsapp ? `https://wa.me/${profile.whatsapp}` : "#";
                    
                    const avatarImg = profile.image_url || "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";
                    document.getElementById('navAvatarImg').src = avatarImg;
                    document.getElementById('usrCardImg').src = avatarImg;
                }
            });

            ['mousemove', 'touchstart', 'click'].forEach(evtName => {
                wrapper.addEventListener(evtName, resetInactivityTimer);
            });
            resetInactivityTimer();
        });

        function resetInactivityTimer() {
            wrapper.classList.remove('hide-ui');
            wrapper.classList.add('show-ui'); 
            clearTimeout(inactivityTimeout);
            inactivityTimeout = setTimeout(() => {
                wrapper.classList.remove('show-ui');
                wrapper.classList.add('hide-ui'); 
            }, 3000);
        }

        async function loadChannelsAndAutoPlay() {
            const overlayZone = document.getElementById('serverOverlay');
            if(!host || !user || !pass) return;

            const url = `${host}/player_api.php?username=${encodeURIComponent(user)}&password=${encodeURIComponent(pass)}&action=get_live_streams`;
            
            try {
                const res = await fetch(url);
                if (!res.ok) throw new Error("Handshake failed");
                const rawChannels = await res.json();
                
                let filtered = Array.isArray(rawChannels) ? rawChannels.filter(chan => chan.name && chan.name.toLowerCase().includes('fifa')) : [];
                let topTwoChannels = filtered.slice(0, 2);
                
                overlayZone.innerHTML = "";
                
                topTwoChannels.forEach((chan, index) => {
                    const serverNum = index + 1;
                    const node = document.createElement('div');
                    node.className = `server-card-node`;
                    node.id = `srvNode-${chan.stream_id}`;
                    node.innerHTML = `
                        <div class="server-icon-frame">S${serverNum}</div>
                        <div class="server-meta">
                            <div class="server-title">Server 0${serverNum}</div>
                            <div class="server-status"><i class="fa-solid fa-bolt" style="font-size:10px;"></i> Live</div>
                        </div>
                    `;
                    
                    node.onclick = function(event) {
                        event.stopPropagation(); 
                        document.querySelectorAll('.server-card-node').forEach(e => e.classList.remove('active'));
                        this.classList.add('active');
                        playStream(chan.stream_id, `Server 0${serverNum} - ${chan.name}`, false);
                        resetInactivityTimer();
                    };
                    overlayZone.appendChild(node);
                });

                if(topTwoChannels.length > 0) {
                    const firstChan = topTwoChannels[0];
                    const firstNode = document.getElementById(`srvNode-${firstChan.stream_id}`);
                    if(firstNode) firstNode.classList.add('active');
                    playStream(firstChan.stream_id, `Server 01 - ${firstChan.name}`, true);
                } else {
                    overlayZone.innerHTML = "<div style='color:#aaa; font-size:13px;'>No Active Live Servers Found.</div>";
                }
            } catch(e) { 
                overlayZone.innerHTML = "<div style='color:red; font-size:13px;'>Failed to handshake matrix feeds.</div>"; 
            }
        }

        function playStream(streamId, streamLabel, isInitialAutoplay) {
            const video = document.getElementById('hlsPlayer');
            document.getElementById('playingTitle').innerText = "Streaming: " + streamLabel;
            const streamUrl = `${host}/live/${user}/${pass}/${streamId}.m3u8`;

            if (hlsInstance) hlsInstance.destroy();

            if(isInitialAutoplay) {
                video.muted = true;
            }

            if (Hls.isSupported()) {
                hlsInstance = new Hls({ maxMaxBufferLength: 10, lowLatencyMode: true });
                hlsInstance.loadSource(streamUrl); 
                hlsInstance.attachMedia(video);
                hlsInstance.on(Hls.Events.MANIFEST_PARSED, () => {
                    video.play().catch(err => console.log("Autoplay context rule applied."));
                });
            } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
                video.src = streamUrl; 
                video.play().catch(err => console.log("iOS Fallback active."));
            }
        }

        function toggleMobileOverlay(event) { resetInactivityTimer(); }
        function handlePlayerDoubleClick(event) {
            event.preventDefault();
            if (!document.fullscreenElement) wrapper.requestFullscreen().catch(e => console.log(e));
            else document.exitFullscreen();
            resetInactivityTimer();
        }
        function toggleMute(e) {
            e.stopPropagation();
            const video = document.getElementById('hlsPlayer');
            const btn = document.getElementById('muteBtn');
            const slider = document.getElementById('volumeSlider');
            video.muted = !video.muted;
            btn.innerHTML = video.muted ? '<i class="fa-solid fa-volume-xmark"></i>' : '<i class="fa-solid fa-volume-high"></i>';
            slider.value = video.muted ? 0 : (video.volume == 0 ? 0.5 : video.volume);
            if(!video.muted && video.volume == 0) video.volume = 0.5;
        }
        function changeVolume(val) {
            const video = document.getElementById('hlsPlayer');
            const btn = document.getElementById('muteBtn');
            video.volume = val; 
            video.muted = (val == 0);
            btn.innerHTML = val == 0 ? '<i class="fa-solid fa-volume-xmark"></i>' : (val > 0.5 ? '<i class="fa-solid fa-volume-high"></i>' : '<i class="fa-solid fa-volume-low"></i>');
        }
        function toggleFullScreen(e) {
            e.stopPropagation();
            if (!document.fullscreenElement) wrapper.requestFullscreen().catch(e => console.log(e));
            else document.exitFullscreen();
        }
        function toggleProfileModal() { document.getElementById('profileModal').classList.toggle('hidden'); }
    </script>
</body>
</html>
