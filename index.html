<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Shop UI</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <script>
        // ==========================================
        // 🛠️ CONFIGURATION SETUP (এখান থেকে পরিবর্তন করুন)
        // ==========================================
        
        const MY_CONFIG = {
            // ১. প্রোফাইল সেটিংস
            name: "Eiroko Dev",                
            bio: "Digital Creator & Developer", 
            profilePic: "https://i.ibb.co.com/n887bQCt/image.jpg", 
            coverPic: "https://images.unsplash.com/photo-1614850523296-d8c1af93d400?auto=format&fit=crop&q=80&w=1000", 

            // ২. কন্টাক্ট সেটিংস
            whatsappNum: "8801700000000",      
            displayPhone: "+880 1700-000000",  
            facebookURL: "https://facebook.com/yourprofile", 

            // ৩. টেলিগ্রাম বোট সেটিংস
            botToken: "YOUR_BOT_TOKEN_HERE",   
            chatID: "YOUR_CHAT_ID_HERE"        
        };

        // ৪. আইটেম লিস্ট (নাম, দাম এবং ছবি এখান থেকে পরিবর্তন করুন)
        const ITEM_LIST = [
            { name: "Premium Filter", price: "500", img: "https://via.placeholder.com/150" },
            { name: "Lightroom Preset", price: "350", img: "https://via.placeholder.com/150" },
            { name: "Video Overlay", price: "800", img: "https://via.placeholder.com/150" },
            { name: "UI Design Kit", price: "1200", img: "https://via.placeholder.com/150" },
            { name: "Custom Logo", price: "2500", img: "https://via.placeholder.com/150" },
            { name: "Social Media Post", price: "600", img: "https://via.placeholder.com/150" }
        ];

        // ==========================================
        // CONFIGURATION শেষ
        // ==========================================
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        body { background: #000; color: white; height: 100vh; display: flex; flex-direction: column; overflow: hidden; border: 8px solid #111; }
        .content-wrapper { flex: 1; position: relative; width: 100%; overflow-y: auto; padding-bottom: 100px; }
        .section { display: none; flex-direction: column; align-items: center; width: 100%; }
        .section.active { display: flex; animation: fadeIn 0.4s ease; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Home Style */
        .cover-photo { width: 100%; height: 180px; background-size: cover; background-position: center; border-bottom: 1px solid #222; position: relative; }
        .profile-pic-wrapper { position: absolute; left: 50%; bottom: -50px; transform: translateX(-50%); }
        .profile-pic { width: 110px; height: 110px; border-radius: 50%; border: 4px solid #000; object-fit: cover; background: #222; }
        .home-info { text-align: center; margin-top: 60px; padding: 0 20px; }

        /* Shop Style */
        .shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; width: 92%; max-width: 500px; margin-top: 20px; }
        .item-card { background: #0f0f0f; border: 1px solid #1a1a1a; border-radius: 18px; padding: 12px; text-align: center; cursor: pointer; transition: 0.3s; }
        .item-card:active { transform: scale(0.95); }
        .item-img { width: 100%; height: 100px; border-radius: 12px; object-fit: cover; margin-bottom: 8px; background: #1a1a1a; }
        .item-card h4 { font-size: 14px; font-weight: 600; margin-bottom: 4px; }
        .price-tag { color: #00ff88; font-weight: 800; font-size: 15px; }

        /* Chat Style */
        .contact-list { width: 90%; max-width: 400px; margin-top: 20px; }
        .contact-btn { display: flex; align-items: center; justify-content: center; padding: 16px; border-radius: 16px; margin-bottom: 12px; text-decoration: none; font-weight: 700; transition: 0.3s; gap: 10px; }
        .whatsapp { background: #25D366; color: white; }
        .facebook { background: #1877F2; color: white; }
        .phone-highlight { background: linear-gradient(145deg, #111, #050505); border: 1px solid #222; padding: 20px; border-radius: 20px; text-align: center; margin-top: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .phone-number { display: block; font-size: 22px; font-weight: 800; margin-top: 8px; color: #fff; letter-spacing: 1px; }

        /* Navigation */
        .nav-wrapper { position: fixed; bottom: 30px; left: 0; right: 0; display: flex; justify-content: center; z-index: 1000; }
        .nav-bar { display: flex; background: rgba(15,15,15,0.9); backdrop-filter: blur(20px); padding: 8px; border-radius: 25px; border: 1px solid rgba(255,255,255,0.1); }
        .nav-item { padding: 12px 25px; border-radius: 20px; cursor: pointer; color: #555; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .nav-item.active { color: #fff; background: rgba(255,255,255,0.1); }
        .nav-item span { display: none; font-weight: 600; }
        .nav-item.active span { display: inline; }

        /* Modal */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal-content { background: #111; padding: 25px; border-radius: 24px; width: 100%; max-width: 360px; border: 1px solid #333; }
        input { width: 100%; padding: 14px; margin-bottom: 12px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 12px; outline: none; }
        .confirm-btn { width: 100%; padding: 14px; background: #fff; color: #000; border: none; border-radius: 12px; font-weight: 800; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <section id="home" class="section active">
            <div id="coverBox" class="cover-photo">
                <div class="profile-pic-wrapper">
                    <img id="userPic" src="" class="profile-pic" alt="Profile">
                </div>
            </div>
            <div class="home-info">
                <h1 id="userName">Loading...</h1>
                <p id="userBio">...</p>
            </div>
        </section>

        <section id="buy" class="section">
            <h2 style="margin-top: 20px; margin-bottom: 10px;">Premium Shop</h2>
            <div class="shop-grid" id="itemGrid">
                </div>
        </section>

        <section id="chat" class="section">
            <h2 style="margin-top: 30px; margin-bottom: 20px;">Contact Support</h2>
            <div class="contact-list">
                <a id="waBtn" href="#" class="contact-btn whatsapp"><i class='bx bxl-whatsapp' style="font-size:24px"></i> WhatsApp Chat</a>
                <a id="fbBtn" href="#" class="contact-btn facebook"><i class='bx bxl-facebook-circle' style="font-size:24px"></i> Facebook Profile</a>
                <div class="phone-highlight">
                    <span style="color: #888; font-size: 11px; letter-spacing: 2px;">DIRECT CALL</span>
                    <span id="phoneDisplay" class="phone-number">000000000</span>
                </div>
            </div>
        </section>
    </div>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h3 id="itemTitle" style="margin-bottom:5px; text-align:center;">Order</h3>
            <p id="itemPriceDisplay" style="text-align:center; color:#00ff88; margin-bottom:20px; font-weight:700;"></p>
            <input type="text" id="orderName" placeholder="আপনার নাম লিখুন">
            <input type="text" id="orderAddress" placeholder="আপনার ঠিকানা">
            <input type="text" id="orderWhatsapp" placeholder="WhatsApp নম্বর দিন">
            <button class="confirm-btn" onclick="sendOrder()">Confirm Order</button>
            <button onclick="closeModal()" style="width:100%; background:none; border:none; color:#666; margin-top:15px; cursor:pointer;">Cancel</button>
        </div>
    </div>

    <div class="nav-wrapper">
        <nav class="nav-bar">
            <div class="nav-item active" onclick="navTo('home', this)"><i class='bx bx-home-alt'></i><span>Home</span></div>
            <div class="nav-item" onclick="navTo('buy', this)"><i class='bx bx-shopping-bag'></i><span>Shop</span></div>
            <div class="nav-item" onclick="navTo('chat', this)"><i class='bx bx-message-square-dots'></i><span>Chat</span></div>
        </nav>
    </div>

    <script>
        // ডাটা লোড করা
        document.getElementById('userName').innerText = MY_CONFIG.name;
        document.getElementById('userBio').innerText = MY_CONFIG.bio;
        document.getElementById('userPic').src = MY_CONFIG.profilePic;
        document.getElementById('coverBox').style.backgroundImage = `url(${MY_CONFIG.coverPic})`;
        document.getElementById('waBtn').href = `https://wa.me/${MY_CONFIG.whatsappNum}`;
        document.getElementById('fbBtn').href = MY_CONFIG.facebookURL;
        document.getElementById('phoneDisplay').innerText = MY_CONFIG.displayPhone;

        // শপ আইটেম জেনারেট করা
        const grid = document.getElementById('itemGrid');
        ITEM_LIST.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.onclick = () => openModal(item.name, item.price);
            card.innerHTML = `
                <img src="${item.img}" class="item-img" alt="${item.name}">
                <h4>${item.name}</h4>
                <p class="price-tag">${item.price} ৳</p>
            `;
            grid.appendChild(card);
        });

        let selectedItem = "";
        let selectedPrice = "";

        function navTo(id, el) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        function openModal(name, price) {
            selectedItem = name;
            selectedPrice = price;
            document.getElementById('itemTitle').innerText = name;
            document.getElementById('itemPriceDisplay').innerText = "Price: " + price + " BDT";
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('orderModal').style.display = 'none'; }

        function sendOrder() {
            const n = document.getElementById('orderName').value;
            const a = document.getElementById('orderAddress').value;
            const w = document.getElementById('orderWhatsapp').value;
            if(!n || !a || !w) return alert("দয়া করে সব তথ্য পূরণ করুন");
            
            const msg = `🛍️ *নতুন অর্ডার!*%0A------------------------%0A📦 আইটেম: ${selectedItem}%0A💰 দাম: ${selectedPrice} BDT%0A👤 নাম: ${n}%0A📍 ঠিকানা: ${a}%0A📱 WhatsApp: ${w}`;
            
            fetch(`https://api.telegram.org/bot${MY_CONFIG.botToken}/sendMessage?chat_id=${MY_CONFIG.chatID}&text=${msg}&parse_mode=Markdown`)
            .then(() => { 
                alert("আপনার অর্ডারটি সফলভাবে পাঠানো হয়েছে!"); 
                closeModal(); 
            }).catch(() => alert("বোট সেটআপে সমস্যা আছে!"));
        }
    </script>
</body>
</html>
