<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eiroko Premium Profile & Shop</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <script>
        // ==========================================
        // 🛠️ CONFIGURATION SETUP (এখান থেকে পরিবর্তন করুন)
        // ==========================================
        
        const MY_CONFIG = {
            // ১. প্রোফাইল সেটিংস
            name: "Eiroko Dev",                
            bio: "Digital Creator & Developer", 
            profilePic: "https://i.ibb.co.com/n887bQCt/image.jpg", 
            coverPic: "https://ibb.co.com/3KxW8RY/image.jpg", // আপনার দেওয়া নতুন কভার ফটো

            // ২. কন্টাক্ট সেটিংস
            whatsappNum: "8801700000000",      // হোয়াটসঅ্যাপ নম্বর (লিঙ্ক তৈরির জন্য - কোডসহ)
            displayPhone: "+880 1700-000000",  // যেটা স্ক্রিনে দেখা যাবে
            facebookURL: "https://facebook.com/yourprofile", 

            // ৩. টেলিগ্রাম বোট সেটিংস (অর্ডারের জন্য)
            botToken: "YOUR_BOT_TOKEN_HERE",   // আপনার বোট টোকেন
            chatID: "YOUR_CHAT_ID_HERE"        // আপনার চ্যাট আইডি
        };

        // ৪. আইটেম লিস্ট (নাম, দাম এবং ছবি এখান থেকে পরিবর্তন করুন)
        const ITEM_LIST = [
            { name: "Premium Filter", price: "500", img: "https://i.ibb.co.com/ZpKH1d4n/image.jpg" }, // ১ম আইটেম
            { name: "Lightroom Preset", price: "350", img: "https://via.placeholder.com/150" },
            { name: "Video Overlay", price: "800", img: "https://via.placeholder.com/150" },
            { name: "UI Design Kit", price: "1200", img: "https://via.placeholder.com/150" },
            { name: "Custom Logo", price: "2500", img: "https://via.placeholder.com/150" },
            { name: "Social Media Post", price: "600", img: "https://via.placeholder.com/150" }
        ];

        // ==========================================
        // CONFIGURATION শেষ
        // ==========================================
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background: #000; 
            color: white; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            border: 8px solid #111; 
        }

        .content-wrapper { 
            flex: 1; 
            position: relative; 
            width: 100%; 
            overflow-y: auto; 
            padding-bottom: 100px; 
            scroll-behavior: smooth;
        }

        .section { display: none; flex-direction: column; align-items: center; width: 100%; }
        .section.active { display: flex; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* Home Layout - Facebook Style */
        .cover-photo { 
            width: 100%; 
            height: 180px; 
            background-size: cover; 
            background-position: center; 
            border-bottom: 1px solid #222; 
            position: relative; 
        }
        .profile-pic-wrapper { 
            position: absolute; 
            left: 50%; 
            bottom: -55px; 
            transform: translateX(-50%); 
        }
        .profile-pic { 
            width: 110px; 
            height: 110px; 
            border-radius: 50%; 
            border: 4px solid #000; 
            object-fit: cover; 
            background: #222; 
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); 
        }
        .home-info { text-align: center; margin-top: 65px; padding: 0 20px; }
        .home-info h1 { font-size: 26px; font-weight: 800; }
        .home-info p { color: #888; font-size: 14px; margin-top: 5px; }

        /* Shop Grid */
        .shop-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 12px; 
            width: 92%; 
            max-width: 500px; 
            margin-top: 20px; 
        }
        .item-card { 
            background: #0f0f0f; 
            border: 1px solid #1a1a1a; 
            border-radius: 20px; 
            padding: 12px; 
            text-align: center; 
            cursor: pointer; 
            transition: 0.2s; 
        }
        .item-card:active { transform: scale(0.95); background: #1a1a1a; }
        .item-img { 
            width: 100%; 
            height: 110px; 
            border-radius: 14px; 
            object-fit: cover; 
            margin-bottom: 10px; 
            background: #1a1a1a; 
        }
        .price-tag { color: #00ff88; font-weight: 800; font-size: 16px; }

        /* Contact Section */
        .contact-list { width: 90%; max-width: 400px; margin-top: 25px; }
        .contact-btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 18px; 
            border-radius: 18px; 
            margin-bottom: 15px; 
            text-decoration: none; 
            font-weight: 700; 
            transition: 0.3s; 
            gap: 12px; 
        }
        .whatsapp { background: #25D366; color: white; }
        .facebook { background: #1877F2; color: white; }
        .phone-highlight { 
            background: rgba(255, 255, 255, 0.05); 
            border: 2px dashed #333; 
            padding: 25px; 
            border-radius: 22px; 
            text-align: center; 
            margin-top: 10px; 
        }
        .phone-number { 
            display: block; 
            font-size: 22px; 
            font-weight: 800; 
            margin-top: 8px; 
            color: #fff; 
            letter-spacing: 1px; 
        }

        /* Bottom Navigation */
        .nav-wrapper { 
            position: fixed; 
            bottom: 30px; 
            left: 0; right: 0; 
            display: flex; 
            justify-content: center; 
            z-index: 1000; 
        }
        .nav-bar { 
            display: flex; 
            background: rgba(15, 15, 15, 0.9); 
            backdrop-filter: blur(25px); 
            padding: 8px; 
            border-radius: 28px; 
            border: 1px solid rgba(255, 255, 255, 0.1); 
            gap: 10px; 
        }
        .nav-item { 
            padding: 12px 28px; 
            border-radius: 22px; 
            cursor: pointer; 
            color: #555; 
            transition: 0.3s; 
            display: flex; 
            align-items: center; 
            gap: 10px; 
        }
        .nav-item.active { color: #fff; background: rgba(255, 255, 255, 0.1); }
        .nav-item span { display: none; font-weight: 700; }
        .nav-item.active span { display: inline; }

        /* Order Modal */
        .modal { 
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; 
            background: rgba(0,0,0,0.95); display: none; 
            align-items: center; justify-content: center; z-index: 2000; padding: 20px; 
        }
        .modal-content { 
            background: #111; 
            padding: 30px; 
            border-radius: 28px; 
            width: 100%; 
            max-width: 370px; 
            border: 1px solid #333; 
        }
        input { 
            width: 100%; padding: 15px; margin-bottom: 12px; 
            background: #1a1a1a; border: 1px solid #333; 
            color: white; border-radius: 14px; outline: none; 
        }
        .confirm-btn { 
            width: 100%; padding: 15px; 
            background: #fff; color: #000; 
            border: none; border-radius: 14px; 
            font-weight: 800; cursor: pointer; 
        }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <section id="home" class="section active">
            <div id="coverBox" class="cover-photo">
                <div class="profile-pic-wrapper">
                    <img id="userPic" src="" class="profile-pic" alt="Profile">
                </div>
            </div>
            <div class="home-info">
                <h1 id="userName">Loading...</h1>
                <p id="userBio">...</p>
            </div>
        </section>

        <section id="buy" class="section">
            <h2 style="margin-top: 25px;">Premium Shop</h2>
            <div class="shop-grid" id="itemGrid"></div>
        </section>

        <section id="chat" class="section">
            <h2 style="margin-top: 30px;">Contact Support</h2>
            <div class="contact-list">
                <a id="waBtn" href="#" class="contact-btn whatsapp"><i class='bx bxl-whatsapp' style="font-size:24px"></i> WhatsApp Chat</a>
                <a id="fbBtn" href="#" class="contact-btn facebook"><i class='bx bxl-facebook-circle' style="font-size:24px"></i> Facebook Profile</a>
                <div class="phone-highlight">
                    <span style="color: #666; font-size: 11px; letter-spacing: 2px;">DIRECT CALL</span>
                    <span id="phoneDisplay" class="phone-number">000000000</span>
                </div>
            </div>
        </section>
    </div>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h3 id="itemTitle" style="text-align:center; margin-bottom:5px;">Order</h3>
            <p id="itemPriceDisplay" style="text-align:center; color:#00ff88; margin-bottom:25px; font-weight:800; font-size:18px;"></p>
            <input type="text" id="orderName" placeholder="আপনার নাম">
            <input type="text" id="orderAddress" placeholder="আপনার ঠিকানা">
            <input type="text" id="orderWhatsapp" placeholder="হোয়াটসঅ্যাপ নম্বর">
            <button class="confirm-btn" onclick="sendOrder()">Confirm Order</button>
            <button onclick="closeModal()" style="width:100%; background:none; border:none; color:#555; margin-top:15px; cursor:pointer;">Cancel</button>
        </div>
    </div>

    <div class="nav-wrapper">
        <nav class="nav-bar">
            <div class="nav-item active" onclick="navTo('home', this)"><i class='bx bx-home-alt-2'></i><span>Home</span></div>
            <div class="nav-item" onclick="navTo('buy', this)"><i class='bx bx-shopping-bag'></i><span>Buy</span></div>
            <div class="nav-item" onclick="navTo('chat', this)"><i class='bx bx-message-square-dots'></i><span>Chat</span></div>
        </nav>
    </div>

    <script>
        // জাভাস্ক্রিপ্ট দিয়ে ডাটা লোড করা
        document.getElementById('userName').innerText = MY_CONFIG.name;
        document.getElementById('userBio').innerText = MY_CONFIG.bio;
        document.getElementById('userPic').src = MY_CONFIG.profilePic;
        document.getElementById('coverBox').style.backgroundImage = `url(${MY_CONFIG.coverPic})`;
        document.getElementById('waBtn').href = `https://wa.me/${MY_CONFIG.whatsappNum}`;
        document.getElementById('fbBtn').href = MY_CONFIG.facebookURL;
        document.getElementById('phoneDisplay').innerText = MY_CONFIG.displayPhone;

        const grid = document.getElementById('itemGrid');
        ITEM_LIST.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.onclick = () => openModal(item.name, item.price);
            card.innerHTML = `
                <img src="${item.img}" class="item-img" alt="${item.name}">
                <h4>${item.name}</h4>
                <p class="price-tag">${item.price} ৳</p>
            `;
            grid.appendChild(card);
        });

        let selectedItem = "";
        let selectedPrice = "";

        function navTo(id, el) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
            document.querySelector('.content-wrapper').scrollTop = 0;
        }

        function openModal(name, price) {
            selectedItem = name;
            selectedPrice = price;
            document.getElementById('itemTitle').innerText = name;
            document.getElementById('itemPriceDisplay').innerText = "৳ " + price;
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('orderModal').style.display = 'none'; }

        function sendOrder() {
            const n = document.getElementById('orderName').value;
            const a = document.getElementById('orderAddress').value;
            const w = document.getElementById('orderWhatsapp').value;
            if(!n || !a || !w) return alert("সব তথ্য দিন");
            
            const msg = `🛍️ *নতুন অর্ডার!*%0Aআইটেম: ${selectedItem}%0Aদাম: ${selectedPrice} BDT%0Aনাম: ${n}%0Aঠিকানা: ${a}%0AWhatsApp: ${w}`;
            fetch(`https://api.telegram.org/bot${MY_CONFIG.botToken}/sendMessage?chat_id=${MY_CONFIG.chatID}&text=${msg}&parse_mode=Markdown`)
            .then(() => { alert("অর্ডার সফল হয়েছে!"); closeModal(); });
        }
    </script>
</body>
</html>
