<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photo Submission - Dashboard</title>
    <style>
        body {
            background-color: #E6EAF0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .upload-card {
            background-color: #E6EAF0;
            border-radius: 40px;
            width: 90%;
            max-width: 400px;
            padding: 40px 30px;
            box-shadow: 20px 20px 60px #d1d9e6, -20px -20px 60px #ffffff;
            text-align: center;
        }

        .tg-logo {
            width: 70px;
            height: 70px;
            margin-bottom: 15px;
            filter: drop-shadow(4px 4px 8px rgba(0,0,0,0.1));
        }

        h2 { font-size: 22px; color: #333; margin: 0 0 10px 0; }
        p { font-size: 13px; color: #777; margin-bottom: 25px; }

        /* Neumorphic File Selector */
        .file-select-area {
            background-color: #E6EAF0;
            border-radius: 20px;
            padding: 25px 15px;
            box-shadow: inset 8px 8px 16px #d1d9e6, inset -8px -8px 16px #ffffff;
            cursor: pointer;
            border: 2px dashed #cbd5e1;
            transition: 0.3s;
            margin-bottom: 20px;
        }

        .file-select-area:hover { border-color: #24A1DE; background-color: #f0f4f8; }

        .file-select-area span {
            display: block;
            font-size: 14px;
            color: #555;
            font-weight: 600;
        }

        #fileList {
            font-size: 12px;
            color: #24A1DE;
            margin-top: 10px;
            text-align: left;
            max-height: 120px;
            overflow-y: auto;
            padding: 5px;
        }

        /* 3D Send Button */
        .send-btn {
            width: 100%;
            border: none;
            background-color: #24A1DE;
            color: white;
            padding: 16px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 6px 6px 12px #b8c2d0, -2px -2px 6px #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            transition: 0.2s;
        }

        .send-btn:active { transform: scale(0.97); box-shadow: 2px 2px 5px #aaa; }
        .send-btn:disabled { background-color: #cbd5e1; color: #888; cursor: not-allowed; box-shadow: none; }

        #status { margin-top: 20px; font-size: 13px; font-weight: 600; min-height: 18px; }
        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="upload-card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="Telegram" class="tg-logo">
        
        <h2>ছবি জমা দিন</h2>
        <p>একাধিক ছবি সিলেক্ট করে সরাসরি বোটে পাঠান</p>

        <form id="uploadForm">
            <div class="file-select-area" onclick="document.getElementById('images').click()">
                <span>📷 গ্যালারি থেকে ছবি বেছে নিন</span>
                <div id="fileList">কোনো ছবি সিলেক্ট করা হয়নি</div>
            </div>
            
            <input type="file" id="images" name="images" accept="image/*" multiple class="hidden" onchange="showFiles()">

            <button type="submit" id="sendBtn" class="send-btn">
                <span>টেলিগ্রামে পাঠান</span>
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
            </button>
        </form>

        <div id="status"></div>
    </div>

    <script>
        // আপনার দেওয়া তথ্য এখানে বসানো হয়েছে
        const BOT_TOKEN = 'AIzaSyDE3as5egNlSZ6tTCTAbRZ9GlOicE0Gs5o'; // আপনার API কী
        const CHAT_ID = '760360352563'; // আপনার চ্যাট আইডি

        function showFiles() {
            const input = document.getElementById('images');
            const list = document.getElementById('fileList');
            if (input.files.length > 0) {
                list.innerHTML = `<strong>নির্বাচিত ফাইল (${input.files.length}):</strong><br>`;
                for (let i = 0; i < input.files.length; i++) {
                    list.innerHTML += `• ${input.files[i].name}<br>`;
                }
            } else {
                list.innerHTML = "কোনো ছবি সিলেক্ট করা হয়নি";
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const files = document.getElementById('images').files;
            const btn = document.getElementById('sendBtn');
            const status = document.getElementById('status');

            if (files.length === 0) {
                alert("দয়া করে ছবি সিলেক্ট করুন!");
                return;
            }

            btn.disabled = true;
            status.innerText = "পাঠানো হচ্ছে... অপেক্ষা করুন।";
            status.style.color = "#333";

            let successCount = 0;

            for (let i = 0; i < files.length; i++) {
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('document', files[i]);
                formData.append('caption', `অর্ডার ছবি: ${i + 1} (Total: ${files.length})`);

                try {
                    const response = await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, {
                        method: 'POST',
                        body: formData
                    });
                    const resJson = await response.json();
                    if (resJson.ok) successCount++;
                } catch (err) {
                    console.error("Error:", err);
                }
            }

            if (successCount === files.length) {
                status.innerText = "সবগুলো ছবি সফলভাবে পাঠানো হয়েছে! ✅";
                status.style.color = "#24A1DE";
                document.getElementById('uploadForm').reset();
                document.getElementById('fileList').innerHTML = "কোনো ছবি সিলেক্ট করা হয়নি";
            } else {
                status.innerText = `${successCount}টি ছবি পাঠানো হয়েছে। বাকিগুলো পাঠাতে সমস্যা হয়েছে।`;
                status.style.color = "#E91E63";
            }
            btn.disabled = false;
        });
    </script>

</body>
</html>
