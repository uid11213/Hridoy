<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eiroko Smooth Sliding UI</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: #050708;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            /* 4-Dike Border */
            border: 10px solid #1a1d21;
        }

        /* --- Content Sections --- */
        .content-wrapper {
            flex: 1;
            position: relative;
        }

        .section {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 20px; text-align: center;
            opacity: 0; visibility: hidden;
            transform: translateY(15px);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .section.active {
            opacity: 1; visibility: visible;
            transform: translateY(0);
        }

        .profile-img {
            width: 100px; height: 100px;
            border-radius: 50%; border: 3px solid rgba(255,255,255,0.1);
            margin-bottom: 20px; object-fit: cover;
        }

        /* --- Sliding Bottom Nav --- */
        .nav-wrapper {
            position: fixed;
            bottom: 30px; left: 0; right: 0;
            display: flex; justify-content: center;
            z-index: 1000;
        }

        .nav-bar {
            position: relative;
            display: flex;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 6px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        /* Moving Indicator (The Liquid Pill) */
        .nav-indicator {
            position: absolute;
            height: calc(100% - 12px);
            top: 6px;
            left: 6px;
            background: #ffffff;
            border-radius: 100px;
            z-index: 1;
            /* Ultra-smooth sliding logic */
            transition: all 0.45s cubic-bezier(0.23, 1, 0.32, 1.15); 
            will-change: transform, width, left;
        }

        .nav-item {
            position: relative;
            display: flex; align-items: center;
            padding: 10px 18px;
            border-radius: 100px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.5);
            z-index: 2; /* Content sits on top of indicator */
            transition: color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-item i { font-size: 22px; }

        .nav-item span {
            font-size: 14px; font-weight: 700;
            width: 0; opacity: 0; overflow: hidden;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            white-space: nowrap;
        }

        /* Active State */
        .nav-item.active { color: #000; }
        .nav-item.active span { width: 45px; margin-left: 8px; opacity: 1; }

    </style>
</head>
<body>

    <div class="content-wrapper">
        <section id="home" class="section active">
            <img src="https://via.placeholder.com/150" class="profile-img">
            <h1>Your Profile</h1>
            <p>Home section e apnar shob details thakbe. Smoothly slide kore check korun.</p>
        </section>

        <section id="exe" class="section">
            <i class='bx bx-terminal' style="font-size: 55px; margin-bottom: 15px;"></i>
            <h1>EXE Software</h1>
            <p>Computer programs and scripts execute here.</p>
        </section>

        <section id="files" class="section">
            <i class='bx bx-folder' style="font-size: 55px; margin-bottom: 15px;"></i>
            <h1>Storage</h1>
            <p>Safe and secure file management system.</p>
        </section>

        <section id="chat" class="section">
            <i class='bx bx-message-square-dots' style="font-size: 55px; margin-bottom: 15px;"></i>
            <h1>Chat</h1>
            <p>Connect with others instantly.</p>
        </section>
    </div>

    <div class="nav-wrapper">
        <nav class="nav-bar" id="navBar">
            <div class="nav-indicator" id="indicator"></div>

            <div class="nav-item active" onclick="jump('home', this)">
                <i class='bx bx-home-alt-2'></i>
                <span>Home</span>
            </div>
            <div class="nav-item" onclick="jump('exe', this)">
                <i class='bx bx-terminal'></i>
                <span>EXE</span>
            </div>
            <div class="nav-item" onclick="jump('files', this)">
                <i class='bx bx-folder'></i>
                <span>Files</span>
            </div>
            <div class="nav-item" onclick="jump('chat', this)">
                <i class='bx bx-message-square-dots'></i>
                <span>Chat</span>
            </div>
        </nav>
    </div>

    <script>
        const indicator = document.getElementById('indicator');

        function slideTo(el) {
            // Pill-er width ebong left position set kora
            indicator.style.width = el.offsetWidth + 'px';
            indicator.style.left = el.offsetLeft + 'px';
        }

        function jump(id, el) {
            // Navigation update
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            el.classList.add('active');

            // Slide the background
            slideTo(el);

            // Switch sections
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // Window load hole default position set kora
        window.onload = () => {
            const active = document.querySelector('.nav-item.active');
            slideTo(active);
        };
    </script>

</body>
</html>
