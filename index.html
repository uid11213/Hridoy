<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Sensi Finder Pro | Intelligent Search</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap');

        body {
            background-color: #0d0d0d;
            color: #dcdcdc;
            font-family: 'Roboto', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 580px;
            background: #111;
            padding: 20px;
            border-radius: 8px;
            border: 1px solid #222;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #ff9900;
            margin-bottom: 20px;
        }

        .search-container {
            position: relative;
            margin-bottom: 25px;
        }

        #phoneInput {
            width: 100%;
            padding: 14px;
            background: #1e1e1e;
            border: 1px solid #444;
            color: white;
            border-radius: 4px;
            font-size: 16px;
            box-sizing: border-box;
            outline: none;
        }

        #phoneInput:focus { border-color: #ff9900; }

        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #1a1a1a;
            border: 1px solid #333;
            max-height: 250px;
            overflow-y: auto;
            z-index: 100;
            display: none;
            border-radius: 0 0 4px 4px;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .suggestions div {
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid #282828;
            transition: 0.2s;
        }

        .suggestions div:hover { background: #ff9900; color: #000; }

        /* FF Realistic Design (Copy of image_0.png) */
        .sensi-box {
            border: 1px solid #222;
            background: #0f0f0f;
        }

        .row {
            display: flex;
            align-items: center;
            padding: 10px 15px;
            border-bottom: 1px solid #222;
        }

        .active-row {
            outline: 2px solid #ff990055;
            background: rgba(255, 153, 0, 0.05);
        }

        .label {
            flex: 2;
            font-size: 14px;
            font-weight: 500;
            color: #d0d0d0;
            text-transform: capitalize;
        }

        .val {
            flex: 0.5;
            text-align: right;
            padding-right: 15px;
            font-weight: bold;
            color: #fff;
            font-size: 18px;
        }

        .slider {
            flex: 3;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sq {
            width: 20px;
            height: 20px;
            background: #2a2a2a;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #444;
            color: white;
            font-weight: bold;
            cursor: pointer;
        }

        .bar {
            flex-grow: 1;
            height: 3px;
            background: #333;
            position: relative;
        }

        .fill {
            height: 100%;
            background: #ff9900;
            position: absolute;
        }

        .dot {
            width: 8px;
            height: 16px;
            background: #fff;
            position: absolute;
            top: -6px;
            border: 1px solid #000;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="color: #ff9900; letter-spacing: 2px; margin-bottom: 10px; text-transform: uppercase;">Sensitivity</h2>
    </div>

    <div class="search-container">
        <input type="text" id="phoneInput" placeholder="Search phone (e.g. iPhone 13, Redmi Note 12)" onkeyup="searchModel()">
        <div id="suggestions" class="suggestions"></div>
    </div>

    <div id="result" class="sensi-box" style="display: none;">
        </div>
</div>

        "Realme 5", "Realme 6", "Realme 7", "Realme 8", "Realme 9", "Realme 10", "Realme 11", "Realme 12", "Realme C1", "Realme C2", "Realme C3", "Realme C5", "Realme C11", "Realme C12", "Realme C15", "Realme C21", "Realme C25", "Realme C30", "Realme C33", "Realme C35", "Realme C51", "Realme C53", "Realme C55", "Realme C67", "Realme C65", "Realme GT Master Edition", "Realme GT Neo 2", "Realme GT Neo 3", "Realme GT Neo 5", "Realme GT 5G", "Realme X3 SuperZoom", "Realme X7 Pro",
        "Vivo Y10", "Vivo Y12", "Vivo Y15", "Vivo Y16", "Vivo Y17", "Vivo Y19", "Vivo Y20", "Vivo Y21", "Vivo Y22", "Vivo Y27", "Vivo Y28", "Vivo Y30", "Vivo Y31", "Vivo Y33s", "Vivo Y35", "Vivo Y36", "Vivo Y50", "Vivo Y51", "Vivo Y53s", "Vivo Y73", "Vivo Y75", "Vivo Y91", "Vivo Y93", "Vivo Y95", "Vivo V15", "Vivo V17 Pro", "Vivo V19", "Vivo V20", "Vivo V21", "Vivo V23", "Vivo V25 Pro", "Vivo V27 Pro", "Vivo V29 Pro", "Vivo V30 Pro", "Vivo T1", "Vivo T2 Pro", "Vivo T3", "iQOO Neo 6", "iQOO Neo 7", "iQOO 9 Pro", "iQOO 11 Pro", "iQOO 12 Pro", "iQOO Z7 Pro", "iQOO Z9",

    ];

    function searchModel() {
        const input = document.getElementById('phoneInput').value.toLowerCase();
        const suggBox = document.getElementById('suggestions');
        suggBox.innerHTML = '';

        if (input.length > 0) {
            const filtered = phoneList.filter(m => m.toLowerCase().includes(input));
            
            if (filtered.length > 0) {
                suggBox.style.display = 'block';
                filtered.forEach(model => {
                    const div = document.createElement('div');
                    div.innerHTML = model;
                    div.onclick = () => selectModel(model);
                    suggBox.appendChild(div);
                });
            } else {
                suggBox.style.display = 'none';
                // Even if not in list, auto-sensi
                showSensi(input);
            }
        } else {
            suggBox.style.display = 'none';
            document.getElementById('result').style.display = 'none';
        }
    }

    function selectModel(model) {
        document.getElementById('phoneInput').value = model;
        document.getElementById('suggestions').style.display = 'none';
        showSensi(model);
    }

    function showSensi(model) {
        const resDiv = document.getElementById('result');
        resDiv.style.display = 'block';

        let hash = 0;
        for (let i = 0; i < model.length; i++) {
            hash = model.charCodeAt(i) + ((hash << 5) - hash);
        }

        const isIphone = model.toLowerCase().includes("iphone") || model.toLowerCase().includes("apple");

        const getVal = (seed, min, max) => {
            const val = Math.abs(Math.sin(hash + seed) * (max - min) + min);
            return Math.floor(val);
        };

        // 1-200 Scale Logic (iPhone General is Lower)
        const settings = [
            { name: "General", val: isIphone ? getVal(10, 100, 150) : getVal(10, 185, 200) },
            { name: "Red Dot", val: getVal(20, 175, 198) },
            { name: "2x Scope", val: getVal(30, 165, 195) },
            { name: "4x Scope", val: getVal(40, 155, 190) },
            { name: "Sniper Scope", val: getVal(50, 80, 130) },
            { name: "Free Look Button", val: getVal(60, 100, 180) }
        ];

        resDiv.innerHTML = '';
        settings.forEach((s, i) => {
            const row = document.createElement('div');
            row.className = `row ${i === 0 ? 'active-row' : ''}`;
            const progress = (s.val / 200) * 100;
            row.innerHTML = `
                <div class="label">${s.name}</div>
                <div class="val">${s.val}</div>
                <div class="slider">
                    <div class="sq">-</div>
                    <div class="bar">
                        <div class="fill" style="width: ${progress}%"></div>
                        <div class="dot" style="left: ${progress}%"></div>
                    </div>
                    <div class="sq">+</div>
                </div>
            `;
            resDiv.appendChild(row);
        });
    }
</script>

</body>
</html>
