<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Realistic Sensi Finder</title>
    <style>
        body {
            background-color: #0a0a0a;
            color: #e0e0e0;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 95%;
            max-width: 600px;
            background: #121212;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 20px rgba(0,0,0,0.8);
        }

        .header-section {
            text-align: center;
            margin-bottom: 25px;
        }

        .input-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 20px;
        }

        input, select {
            padding: 12px;
            background: #1e1e1e;
            border: 1px solid #333;
            color: white;
            border-radius: 4px;
            outline: none;
        }

        button {
            padding: 12px;
            background: #ffae00;
            border: none;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            transition: 0.3s;
        }

        button:hover { background: #e69d00; }

        /* Realistic Sensi Row Styles */
        .sensi-container {
            border: 1px solid #222;
        }

        .sensi-row {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #222;
            background: rgba(255, 255, 255, 0.02);
        }

        .sensi-row.active {
            border: 1.5px solid #ffae0088;
            background: rgba(255, 174, 0, 0.05);
        }

        .label {
            flex: 2;
            font-size: 16px;
            font-weight: 500;
        }

        .value {
            flex: 0.5;
            text-align: right;
            font-family: monospace;
            font-size: 18px;
            padding-right: 15px;
        }

        .slider-box {
            flex: 3;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .btn-sq {
            width: 25px;
            height: 25px;
            background: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            font-size: 18px;
        }

        .track {
            flex-grow: 1;
            height: 4px;
            background: #333;
            position: relative;
        }

        .fill {
            height: 100%;
            background: #ffae00;
            position: absolute;
        }

        .thumb {
            width: 8px;
            height: 16px;
            background: white;
            position: absolute;
            top: -6px;
            box-shadow: 0 0 5px rgba(0,0,0,0.5);
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h2 style="color: #ffae00; letter-spacing: 2px;">SENSITIVITY</h2>
    </div>

    <div class="input-group">
        <input type="text" id="modelName" placeholder="Enter Phone Model (e.g. iPhone 13)">
        <button onclick="generateSensi()">GET SETTINGS</button>
    </div>

    <div id="displayArea" style="display: none;" class="sensi-container">
        </div>
</div>

<script>
    function generateSensi() {
        const model = document.getElementById('modelName').value.trim().toLowerCase();
        if (!model) {
            alert("Please enter a phone model!");
            return;
        }

        // Logic to keep the sensitivity SAME for the same model name
        // Hash function converts string to a consistent number
        let hash = 0;
        for (let i = 0; i < model.length; i++) {
            hash = model.charCodeAt(i) + ((hash << 5) - hash);
        }

        const getVal = (seed, min, max) => {
            const val = Math.abs(Math.sin(hash + seed) * (max - min) + min);
            return Math.floor(val);
        };

        const settings = [
            { name: "General", val: getVal(1, 90, 100) },
            { name: "Red Dot", val: getVal(2, 85, 98) },
            { name: "2x Scope", val: getVal(3, 80, 95) },
            { name: "4x Scope", val: getVal(4, 75, 92) },
            { name: "Sniper Scope", val: getVal(5, 40, 60) },
            { name: "Free Camera Button", val: getVal(6, 50, 80) }
        ];

        const displayArea = document.getElementById('displayArea');
        displayArea.innerHTML = '';
        displayArea.style.display = 'block';

        settings.forEach((s, index) => {
            const row = document.createElement('div');
            row.className = `sensi-row ${index === 0 ? 'active' : ''}`;
            row.innerHTML = `
                <div class="label">${s.name}</div>
                <div class="value">${s.val}</div>
                <div class="slider-box">
                    <div class="btn-sq">-</div>
                    <div class="track">
                        <div class="fill" style="width: ${s.val}%"></div>
                        <div class="thumb" style="left: ${s.val}%"></div>
                    </div>
                    <div class="btn-sq">+</div>
                </div>
            `;
            displayArea.appendChild(row);
        });
    }
</script>

</body>
</html>
