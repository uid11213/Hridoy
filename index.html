<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Guitar Shop - Strings & Accessories</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f4f4;
            color: #333;
        }

        /* Header Section */
        header {
            background-color: #1a1a1a;
            color: #fff;
            padding: 20px 0;
            text-align: center;
        }

        header h1 {
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        /* Hero Banner */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1550985616-10810253b84d?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            height: 300px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            text-align: center;
        }

        /* Product Section */
        .container {
            max-width: 1100px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .section-title {
            text-align: center;
            margin-bottom: 40px;
            font-size: 28px;
            border-bottom: 2px solid #e67e22;
            display: inline-block;
            padding-bottom: 5px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }

        .product-card {
            background: #fff;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            transition: transform 0.3s ease;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-card img {
            max-width: 100%;
            height: 200px;
            object-fit: contain;
            margin-bottom: 15px;
        }

        .product-card h3 {
            margin-bottom: 10px;
            font-size: 20px;
        }

        .price {
            color: #e67e22;
            font-weight: bold;
            font-size: 18px;
            display: block;
            margin-bottom: 15px;
        }

        .buy-btn {
            background-color: #e67e22;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            font-weight: bold;
        }

        .buy-btn:hover {
            background-color: #d35400;
        }

        footer {
            text-align: center;
            padding: 30px;
            background: #1a1a1a;
            color: white;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <header>
        <h1>Guitar Shop</h1>
        <p>Premium Strings & Guitar Accessories</p>
    </header>

    <div class="hero">
        <div>
            <h2>Best Strings for Your Guitar</h2>
            <p>Quality sounds start with quality strings.</p>
        </div>
    </div>

    <div class="container">
        <center><h2 class="section-title">Our Products</h2></center>
        
        <div class="product-grid">
            <div class="product-card">
                <img src="https://m.media-amazon.com/images/I/71pE7I0V-0L._SL1500_.jpg" alt="Zico Strings">
                <h3>Zico Acoustic Strings</h3>
                <span class="price">৳ 350.00</span>
                <button class="buy-btn">Buy Now</button>
            </div>

            <div class="product-card">
                <img src="https://m.media-amazon.com/images/I/61kYmFpDlvL._SL1000_.jpg" alt="Orphee Strings">
                <h3>Orphee TX620 Strings</h3>
                <span class="price">৳ 450.00</span>
                <button class="buy-btn">Buy Now</button>
            </div>

            <div class="product-card">
                <img src="https://m.media-amazon.com/images/I/719hZkX8XIL._SL1500_.jpg" alt="Alice Strings">
                <h3>Alice A406 Strings Set</h3>
                <span class="price">৳ 280.00</span>
                <button class="buy-btn">Buy Now</button>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 Guitar Shop | All Rights Reserved</p>
    </footer>

</body>
</html>
