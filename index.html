<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Sensi Finder - Select Model</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
        }

        .container {
            width: 95%;
            max-width: 600px;
            background: #151515;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.7);
        }

        .header-section {
            text-align: center;
            margin-bottom: 25px;
            border-bottom: 1px solid #333;
            padding-bottom: 10px;
        }

        .selection-area {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 30px;
        }

        label { font-size: 14px; color: #888; margin-bottom: -10px; }

        select {
            padding: 14px;
            background: #1e1e1e;
            border: 1px solid #ffae00;
            color: white;
            border-radius: 6px;
            outline: none;
            font-size: 16px;
        }

        /* FF Realistic Row Design */
        .sensi-container {
            border: 1px solid #222;
            background: #111;
        }

        .sensi-row {
            display: flex;
            align-items: center;
            padding: 15px;
            border-bottom: 1px solid #222;
        }

        .sensi-row.active {
            outline: 2px solid #ffae00;
            background: rgba(255, 174, 0, 0.05);
            position: relative;
            z-index: 10;
        }

        .label-text {
            flex: 2;
            font-size: 16px;
            font-weight: 500;
        }

        .num-val {
            flex: 0.5;
            text-align: right;
            font-family: 'Courier New', monospace;
            font-size: 20px;
            padding-right: 20px;
            color: #fff;
        }

        .slider-box {
            flex: 3;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sq-btn {
            width: 28px;
            height: 28px;
            background: #2a2a2a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            border: 1px solid #444;
            font-weight: bold;
        }

        .track-bg {
            flex-grow: 1;
            height: 5px;
            background: #333;
            position: relative;
        }

        .track-fill {
            height: 100%;
            background: #ffae00;
            position: absolute;
        }

        .slider-thumb {
            width: 8px;
            height: 18px;
            background: #fff;
            position: absolute;
            top: -6px;
            border: 1px solid #000;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="header-section">
        <h2 style="color: #ffae00; margin: 0; letter-spacing: 3px;">SENSITIVITY</h2>
    </div>

    <div class="selection-area">
        <label>Select Brand</label>
        <select id="brandSelect" onchange="updateModels()">
            <option value="">-- Choose Brand --</option>
            <option value="iphone">Apple (iPhone)</option>
            <option value="samsung">Samsung</option>
            <option value="xiaomi">Xiaomi / Poco</option>
            <option value="realme">Realme</option>
        </select>

        <label>Select Model</label>
        <select id="modelSelect" onchange="showSensi()">
            <option value="">-- Select Model --</option>
        </select>
    </div>

    <div id="sensiDisplay" class="sensi-container" style="display: none;">
        </div>
</div>

<script>
    // Database of Models
    const deviceData = {
        iphone: ["iPhone 11", "iPhone 12", "iPhone 13 Pro", "iPhone 14 Pro Max", "iPhone 15"],
        samsung: ["Galaxy S21", "Galaxy S22 Ultra", "Galaxy A54", "Galaxy M32", "Galaxy S23"],
        xiaomi: ["Redmi Note 10", "Redmi Note 12", "Poco X3 Pro", "Poco F5", "Xiaomi 13T"],
        realme: ["Realme GT Neo 3", "Realme 9 Pro", "Realme C55", "Realme 11 Pro+"]
    };

    function updateModels() {
        const brand = document.getElementById('brandSelect').value;
        const modelSelect = document.getElementById('modelSelect');
        const sensiDisplay = document.getElementById('sensiDisplay');
        
        modelSelect.innerHTML = '<option value="">-- Select Model --</option>';
        sensiDisplay.style.display = 'none';

        if (brand && deviceData[brand]) {
            deviceData[brand].forEach(model => {
                let opt = document.createElement('option');
                opt.value = model;
                opt.innerHTML = model;
                modelSelect.appendChild(opt);
            });
        }
    }

    function showSensi() {
        const model = document.getElementById('modelSelect').value;
        const display = document.getElementById('sensiDisplay');

        if (!model) {
            display.style.display = 'none';
            return;
        }

        // Consistent Random Logic (Same model = Same result)
        let hash = 0;
        for (let i = 0; i < model.length; i++) {
            hash = model.charCodeAt(i) + ((hash << 5) - hash);
        }

        const getVal = (seed, min, max) => {
            const val = Math.abs(Math.sin(hash + seed) * (max - min) + min);
            return Math.floor(val);
        };

        const settings = [
            { name: "General", val: getVal(10, 95, 100) },
            { name: "Red Dot", val: getVal(20, 90, 98) },
            { name: "2x Scope", val: getVal(30, 85, 95) },
            { name: "4x Scope", val: getVal(40, 80, 92) },
            { name: "Sniper Scope", val: getVal(50, 45, 65) },
            { name: "Free Camera Button", val: getVal(60, 50, 90) }
        ];

        display.innerHTML = '';
        display.style.display = 'block';

        settings.forEach((s, index) => {
            const row = document.createElement('div');
            row.className = `sensi-row ${index === 0 ? 'active' : ''}`;
            row.innerHTML = `
                <div class="label-text">${s.name}</div>
                <div class="num-val">${s.val}</div>
                <div class="slider-box">
                    <div class="sq-btn">-</div>
                    <div class="track-bg">
                        <div class="track-fill" style="width: ${s.val}%"></div>
                        <div class="slider-thumb" style="left: ${s.val}%"></div>
                    </div>
                    <div class="sq-btn">+</div>
                </div>
            `;
            display.appendChild(row);
        });
    }
</script>

</body>
</html>
