<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium 3D Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg: #050505;
            --card-bg: #111111;
            --accent: #ffffff;
            --silver: linear-gradient(135deg, #f5f7fa 0%, #c3cfe2 100%);
            --border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: var(--bg);
            color: white;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        /* Bento Grid Layout */
        .bento-container {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: auto;
            gap: 15px;
            max-width: 900px;
            width: 100%;
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 20px;
            position: relative;
            overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        .card:hover {
            transform: translateY(-8px) scale(1.02);
            border-color: rgba(255, 255, 255, 0.3);
            box-shadow: 0 20px 40px rgba(255, 255, 255, 0.05);
        }

        /* Profile Section (Big Card) */
        .profile-card {
            grid-column: span 2;
            grid-row: span 2;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: linear-gradient(145deg, #151515, #000);
        }

        .profile-img {
            width: 130px;
            height: 130px;
            border-radius: 50%;
            background: var(--silver);
            padding: 4px;
            margin-bottom: 15px;
            box-shadow: 0 0 30px rgba(255,255,255,0.1);
        }

        /* Clock Card */
        .clock-card {
            grid-column: span 2;
            background: var(--silver);
            color: black;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 2.5rem;
            font-weight: 800;
        }

        /* Social Cards */
        .social-card {
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.5rem;
            text-decoration: none;
            color: white;
        }

        .social-card.fb { background: #0866FF; }
        .social-card.wa { background: #25D366; }
        .social-card.tg { background: #0088cc; }
        .social-card.ig { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }

        /* Utility/E-com Section */
        .help-card {
            grid-column: span 2;
            background: rgba(255, 255, 255, 0.05);
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .help-card h3 { color: #fff; margin-bottom: 10px; font-size: 1.2rem; }
        .help-card p { font-size: 0.85rem; opacity: 0.7; margin-bottom: 15px; }

        .service-btn {
            padding: 12px;
            background: white;
            color: black;
            border-radius: 12px;
            text-align: center;
            text-decoration: none;
            font-weight: 700;
            font-size: 0.9rem;
            transition: 0.3s;
        }

        .service-btn:hover { background: #ccc; }

        /* Real-time Indicator */
        .status {
            position: absolute;
            top: 15px;
            left: 15px;
            display: flex;
            align-items: center;
            gap: 6px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .dot {
            width: 8px;
            height: 8px;
            background: #25D366;
            border-radius: 50%;
            box-shadow: 0 0 10px #25D366;
            animation: blink 1.5s infinite;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.3; }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .bento-container { grid-template-columns: repeat(2, 1fr); }
            .profile-card { grid-column: span 2; }
            .clock-card { grid-column: span 2; font-size: 2rem; }
        }
    </style>
</head>
<body>

    <div class="bento-container">
        <div class="card profile-card">
            <div class="status"><div class="dot"></div> Online</div>
            <img src="https://via.placeholder.com/150" alt="Tarek" class="profile-img">
            <h2>Tarek</h2>
            <p style="opacity: 0.6; font-size: 0.9rem;">REDBOT | Creative Lead</p>
        </div>

        <div class="card clock-card" id="clock">00:00</div>

        <div class="card help-card">
            <div>
                <h3><i class="fas fa-bolt"></i> Quick Support</h3>
                <p>Ami apnader digital branding ar technical somossay sahajjo korte pari. Jono kono proyojone message din.</p>
            </div>
            <a href="#" class="service-btn">Get Help Now</a>
        </div>

        <a href="#" class="card social-card fb"><i class="fab fa-facebook-f"></i></a>
        <a href="#" class="card social-card wa"><i class="fab fa-whatsapp"></i></a>
        <a href="#" class="card social-card tg"><i class="fab fa-telegram-plane"></i></a>
        <a href="#" class="card social-card ig"><i class="fab fa-instagram"></i></a>

        <div class="card" style="grid-column: span 2; display: flex; align-items: center; gap: 15px;">
            <i class="fas fa-shield-halved" style="font-size: 2rem; color: #silver;"></i>
            <div>
                <h4 style="font-size: 0.9rem;">Trusted Services</h4>
                <p style="font-size: 0.75rem; opacity: 0.6;">100% Secure & Professional Work</p>
            </div>
        </div>
    </div>

    <script>
        function updateClock() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${h}:${m}`;
        }
        setInterval(updateClock, 1000);
        updateClock();
    </script>
</body>
</html>
