<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hridoy Music Store</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <script>
        const MY_CONFIG = {
            name: "AHMED HRIDOY",                
            bio: "ALL MUSICAL INSTUMENTS GUITAR UKULELE SHOP SIRAJGANJ", 
            profilePic: "https://i.ibb.co.com/n887bQCt/image.jpg", 
            whatsappNum: "8801700000000",      
            displayPhone: "+880 1700-000000",  
            botToken: "8656077538:AAHk5W9TqlrVNODNALFiO6bGpvkmnTYWYYY",   
            chatID: "8535841928"        
        };

        const ITEM_LIST = [
            { name: "Signature Guitar 265", price: "15500", img: "https://i.ibb.co.com/ZpKH1d4n/image.jpg", available: true }, 
            { name: "AXE 48c", price: "12000", img: "https://i.ibb.co.com/BVtFghPT/image.jpg", available: true },
            { name: "TGM", price: "9500", img: "https://i.ibb.co.com/7J16YptF/image.jpg", available: true },
            { name: "Ukulele 26\"", price: "4500", img: "https://i.ibb.co.com/VW3H5MLr/image.jpg", available: true },
            { name: "Ukulele 24\"", price: "3800", img: "https://i.ibb.co.com/VW3H5MLr/image.jpg", available: true },
            { name: "Yemaha cm2", price: "18000", img: "https://i.ibb.co.com/TMYSqKCM/image.jpg", available: true }
        ];
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        /* স্ক্রলিং ইনেবল করার জন্য overflow আপডেট */
        html, body { 
            touch-action: manipulation; 
            background: #000; 
            color: white; 
            height: 100%; 
            overflow-x: hidden; /* ডানে-বামে স্ক্রল বন্ধ */
            overflow-y: auto;   /* উপর-নিচে স্ক্রল চালু */
        }

        body { border: 8px solid #111; min-height: 100vh; display: flex; flex-direction: column; }

        .content-wrapper { 
            flex: 1; 
            width: 100%; 
            padding-bottom: 120px; /* নিচের নেভিগেশন বারের জন্য গ্যাপ */
        }

        .section { display: none; flex-direction: column; align-items: center; width: 100%; padding: 0 15px; }
        .section.active { display: flex; animation: fadeIn 0.3s ease-out; }
        
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }

        /* Profile Section */
        .header-spacer { width: 100%; height: 40px; }
        .profile-pic { width: 125px; height: 125px; border-radius: 50%; border: 3px solid #00ff88; object-fit: cover; background: #222; box-shadow: 0 0 25px rgba(0, 255, 136, 0.15); }
        .home-info { text-align: center; margin-top: 20px; }
        .home-info h1 { font-size: 28px; font-weight: 800; color: #fff; }
        .home-info p { color: #777; font-size: 15px; margin-top: 8px; line-height: 1.4; }

        /* Shop Grid */
        .shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; max-width: 500px; margin-top: 25px; }
        .item-card { background: #0f0f0f; border: 1px solid #1a1a1a; border-radius: 24px; padding: 15px; text-align: center; cursor: pointer; }
        .item-img { width: 100%; height: 120px; border-radius: 18px; object-fit: cover; margin-bottom: 12px; background: #1a1a1a; }
        .status-badge { font-size: 9px; font-weight: 800; padding: 4px 10px; border-radius: 20px; text-transform: uppercase; margin-bottom: 8px; display: inline-block; }
        .status-available { background: rgba(0, 255, 136, 0.1); color: #00ff88; }
        .status-out { background: rgba(255, 60, 60, 0.1); color: #ff3c3c; }
        .price-tag { color: #00ff88; font-weight: 800; font-size: 17px; }

        /* Contact Section */
        .contact-list { width: 100%; max-width: 400px; margin-top: 25px; }
        .contact-btn { display: flex; align-items: center; justify-content: center; padding: 18px; border-radius: 22px; margin-bottom: 15px; text-decoration: none; font-weight: 700; gap: 12px; background: #25D366; color: white; }
        .phone-highlight { background: #0f0f0f; border: 1px solid #222; padding: 25px; border-radius: 24px; text-align: center; }
        .phone-number { display: block; font-size: 24px; font-weight: 800; margin-top: 8px; color: #fff; }

        /* Navigation */
        .nav-wrapper { position: fixed; bottom: 30px; left: 0; right: 0; display: flex; justify-content: center; z-index: 1000; }
        .nav-bar { display: flex; background: rgba(15, 15, 15, 0.95); backdrop-filter: blur(15px); padding: 8px; border-radius: 35px; border: 1px solid rgba(255, 255, 255, 0.1); }
        .nav-item { padding: 12px 22px; border-radius: 25px; cursor: pointer; color: #555; display: flex; align-items: center; gap: 8px; transition: 0.3s; }
        .nav-item.active { color: #fff; background: rgba(255, 255, 255, 0.1); }
        .nav-item span { display: none; font-weight: 700; font-size: 14px; }
        .nav-item.active span { display: inline; }

        /* Order Modal */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal-content { background: #111; padding: 30px; border-radius: 30px; width: 100%; max-width: 370px; border: 1px solid #333; }
        input { width: 100%; padding: 15px; margin-bottom: 12px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 14px; outline: none; font-size: 16px !important; }
        .confirm-btn { width: 100%; padding: 16px; background: #fff; color: #000; border: none; border-radius: 14px; font-weight: 800; cursor: pointer; }

        .success-overlay {
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: #00ff88; color: #000; padding: 20px 40px; border-radius: 20px; font-weight: 800;
            z-index: 3000; box-shadow: 0 10px 40px rgba(0, 255, 136, 0.4); text-align: center;
        }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <section id="home" class="section active">
            <div class="header-spacer"></div>
            <img id="userPic" src="" class="profile-pic" alt="Profile">
            <div class="home-info">
                <h1 id="userName">Loading...</h1>
                <p id="userBio">...</p>
            </div>
        </section>

        <section id="buy" class="section">
            <h2 style="margin-top: 30px; font-weight: 800;">Musical Shop</h2>
            <div class="shop-grid" id="itemGrid"></div>
        </section>

        <section id="chat" class="section">
            <h2 style="margin-top: 35px; font-weight: 800;">Contact Me</h2>
            <div class="contact-list">
                <a id="waBtn" href="#" class="contact-btn"><i class='bx bxl-whatsapp' style="font-size:24px"></i> WhatsApp Chat</a>
                <div class="phone-highlight">
                    <span style="color: #444; font-size: 11px; letter-spacing: 2px; font-weight: 800;">DIRECT CALL</span>
                    <span id="phoneDisplay" class="phone-number">000000000</span>
                </div>
            </div>
        </section>
    </div>

    <div id="successMsg" class="success-overlay">✅ অর্ডার সফল হয়েছে!</div>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h3 id="itemTitle" style="text-align:center;">Order</h3>
            <p id="itemPriceDisplay" style="text-align:center; color:#00ff88; margin-bottom:20px; font-weight:800; font-size:18px;"></p>
            <input type="text" id="orderName" placeholder="আপনার নাম">
            <input type="text" id="orderAddress" placeholder="আপনার ঠিকানা">
            <input type="text" id="orderWhatsapp" placeholder="WhatsApp নম্বর">
            <button class="confirm-btn" onclick="sendOrder()">Confirm Order</button>
            <button onclick="closeModal()" style="width:100%; background:none; border:none; color:#555; margin-top:15px; cursor:pointer;">Cancel</button>
        </div>
    </div>

    <div class="nav-wrapper">
        <nav class="nav-bar">
            <div class="nav-item active" onclick="navTo('home', this)"><i class='bx bx-home-alt-2'></i><span>Home</span></div>
            <div class="nav-item" onclick="navTo('buy', this)"><i class='bx bx-shopping-bag'></i><span>Shop</span></div>
            <div class="nav-item" onclick="navTo('chat', this)"><i class='bx bx-message-square-dots'></i><span>Chat</span></div>
        </nav>
    </div>

    <script>
        document.getElementById('userName').innerText = MY_CONFIG.name;
        document.getElementById('userBio').innerText = MY_CONFIG.bio;
        document.getElementById('userPic').src = MY_CONFIG.profilePic;
        document.getElementById('waBtn').href = `https://wa.me/${MY_CONFIG.whatsappNum}`;
        document.getElementById('phoneDisplay').innerText = MY_CONFIG.displayPhone;

        const grid = document.getElementById('itemGrid');
        ITEM_LIST.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            const badge = item.available ? '<span class="status-badge status-available">Available</span>' : '<span class="status-badge status-out">Out</span>';
            card.onclick = () => openModal(item.name, item.price);
            card.innerHTML = `<img src="${item.img}" class="item-img">${badge}<h4>${item.name}</h4><p class="price-tag">${item.price} ৳</p>`;
            grid.appendChild(card);
        });

        function navTo(id, el) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
            window.scrollTo(0,0); // নতুন সেকশনে গেলে উপরে স্ক্রল হবে
        }

        function openModal(name, price) {
            document.getElementById('itemTitle').innerText = name;
            document.getElementById('itemPriceDisplay').innerText = price + " ৳";
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('orderModal').style.display = 'none'; }

        function sendOrder() {
            const n = document.getElementById('orderName').value;
            const a = document.getElementById('orderAddress').value;
            const w = document.getElementById('orderWhatsapp').value;
            if(!n || !a || !w) return;

            const msg = `🛍️ *নতুন অর্ডার!*%0Aআইটেম: ${document.getElementById('itemTitle').innerText}%0Aদাম: ${document.getElementById('itemPriceDisplay').innerText}%0Aনাম: ${n}%0Aঠিকানা: ${a}%0AWhatsApp: ${w}`;
            
            fetch(`https://api.telegram.org/bot${MY_CONFIG.botToken}/sendMessage?chat_id=${MY_CONFIG.chatID}&text=${msg}&parse_mode=Markdown`)
            .then(() => {
                closeModal();
                const successEl = document.getElementById('successMsg');
                successEl.style.display = 'block';
                setTimeout(() => { successEl.style.display = 'none'; }, 3000);
            });
        }
    </script>
</body>
</html>
