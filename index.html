<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eiroko Premium Shop UI</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

        body {
            background: #050505;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 10px solid #111;
        }

        .content-wrapper { flex: 1; position: relative; width: 100%; }

        .section {
            position: absolute;
            top: 0; left: 0;
            width: 100%; height: 100%;
            display: none;
            flex-direction: column;
            align-items: center;
            padding: 20px;
            overflow-y: auto;
            padding-bottom: 100px;
        }

        .section.active { display: flex; animation: fadeIn 0.4s ease; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Shop Grid --- */
        .shop-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 15px;
            width: 100%;
            max-width: 500px;
            margin-top: 20px;
        }

        .item-card {
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 15px;
            padding: 15px;
            text-align: center;
            cursor: pointer;
            transition: 0.3s;
        }

        .item-card:hover { background: rgba(255, 255, 255, 0.1); border-color: #fff; }

        .item-img-placeholder {
            width: 100%;
            height: 100px;
            background: #222;
            border-radius: 10px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            color: #444;
        }

        /* --- Order Modal --- */
        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.9);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 2000;
            padding: 20px;
        }

        .modal-content {
            background: #111;
            padding: 25px;
            border-radius: 20px;
            width: 100%;
            max-width: 350px;
            border: 1px solid #333;
        }

        .modal-content h2 { margin-bottom: 15px; font-size: 20px; text-align: center; }

        input {
            width: 100%;
            padding: 12px;
            margin-bottom: 12px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: white;
            border-radius: 10px;
            outline: none;
        }

        .buy-btn {
            width: 100%;
            padding: 12px;
            background: #fff;
            color: #000;
            border: none;
            border-radius: 10px;
            font-weight: 800;
            cursor: pointer;
        }

        /* --- Navigation --- */
        .nav-wrapper {
            position: fixed;
            bottom: 30px; left: 0; right: 0;
            display: flex; justify-content: center;
            z-index: 1000;
        }

        .nav-bar {
            display: flex; background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(20px);
            padding: 8px; border-radius: 25px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        .nav-item {
            padding: 12px 20px; border-radius: 20px;
            cursor: pointer; color: #666; transition: 0.3s;
            display: flex; align-items: center;
        }

        .nav-item.active { color: #fff; background: rgba(255,255,255,0.1); }
        .nav-item span { display: none; margin-left: 8px; font-weight: 600; }
        .nav-item.active span { display: inline; }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <section id="home" class="section active">
            <h1 style="margin-top: 100px;">Welcome Back</h1>
            <p style="color: #888;">Eiroko Profile UI</p>
        </section>

        <section id="buy" class="section">
            <h1 style="margin-top: 20px;">Premium Shop</h1>
            <p style="color: #888; margin-bottom: 10px;">Select an item to buy</p>
            
            <div class="shop-grid">
                <div class="item-card" onclick="openModal('Item #1')">
                    <div class="item-img-placeholder"><i class='bx bx-package'></i></div>
                    <h4>Item 1</h4>
                    <p style="font-size: 12px; color: #00ff88;">$10.00</p>
                </div>
                <div class="item-card" onclick="openModal('Item #2')">
                    <div class="item-img-placeholder"><i class='bx bx-package'></i></div>
                    <h4>Item 2</h4>
                    <p style="font-size: 12px; color: #00ff88;">$15.00</p>
                </div>
                <div class="item-card" onclick="openModal('Item #3')">
                    <div class="item-img-placeholder"><i class='bx bx-package'></i></div>
                    <h4>Item 3</h4>
                    <p style="font-size: 12px; color: #00ff88;">$20.00</p>
                </div>
                <div class="item-card" onclick="openModal('Item #4')">
                    <div class="item-img-placeholder"><i class='bx bx-package'></i></div>
                    <h4>Item 4</h4>
                    <p style="font-size: 12px; color: #00ff88;">$25.00</p>
                </div>
                <div class="item-card" onclick="openModal('Item #5')">
                    <div class="item-img-placeholder"><i class='bx bx-package'></i></div>
                    <h4>Item 5</h4>
                    <p style="font-size: 12px; color: #00ff88;">$30.00</p>
                </div>
                <div class="item-card" onclick="openModal('Item #6')">
                    <div class="item-img-placeholder"><i class='bx bx-package'></i></div>
                    <h4>Item 6</h4>
                    <p style="font-size: 12px; color: #00ff88;">$50.00</p>
                </div>
            </div>
        </section>
    </div>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h2 id="selectedItemName">Order Form</h2>
            <input type="text" id="userName" placeholder="আপনার নাম">
            <input type="text" id="userAddress" placeholder="আপনার ঠিকানা">
            <input type="text" id="userWhatsapp" placeholder="হোয়াটসঅ্যাপ নাম্বার">
            <button class="buy-btn" onclick="sendToTelegram()">Confirm Order</button>
            <button onclick="closeModal()" style="background:transparent; color:#888; border:none; width:100%; margin-top:10px; cursor:pointer;">Cancel</button>
        </div>
    </div>

    <div class="nav-wrapper">
        <nav class="nav-bar">
            <div class="nav-item active" onclick="navTo('home', this)">
                <i class='bx bx-home-alt'></i><span>Home</span>
            </div>
            <div class="nav-item" onclick="navTo('buy', this)">
                <i class='bx bx-shopping-bag'></i><span>Buy</span>
            </div>
            <div class="nav-item">
                <i class='bx bx-folder'></i><span>Files</span>
            </div>
            <div class="nav-item">
                <i class='bx bx-message-dots'></i><span>Chat</span>
            </div>
        </nav>
    </div>

    <script>
        let currentItem = "";

        function navTo(id, el) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        function openModal(itemName) {
            currentItem = itemName;
            document.getElementById('selectedItemName').innerText = "Order: " + itemName;
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('orderModal').style.display = 'none';
        }

        function sendToTelegram() {
            const name = document.getElementById('userName').value;
            const address = document.getElementById('userAddress').value;
            const whatsapp = document.getElementById('userWhatsapp').value;

            if(!name || !address || !whatsapp) {
                alert("সবগুলো ঘর পূরণ করুন!");
                return;
            }

            // Telegram Bot Details (এখানে আপনার তথ্য বসান)
            const token = "YOUR_BOT_TOKEN"; 
            const chat_id = "YOUR_CHAT_ID";
            
            const message = `🛍️ *New Order!*%0A%0A📦 Item: ${currentItem}%0A👤 Name: ${name}%0A📍 Address: ${address}%0A📱 WhatsApp: ${whatsapp}`;

            const url = `https://api.telegram.org/bot${token}/sendMessage?chat_id=${chat_id}&text=${message}&parse_mode=Markdown`;

            fetch(url).then(res => {
                alert("আপনার অর্ডারটি সফলভাবে পাঠানো হয়েছে!");
                closeModal();
            }).catch(err => {
                alert("অর্ডার পাঠাতে সমস্যা হয়েছে।");
            });
        }
    </script>
</body>
</html>
