<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Pro Sensi Finder</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Arial', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: #151515;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #222;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #ffae00;
            margin-bottom: 20px;
        }

        .search-area {
            position: relative;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 15px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
            outline: none;
            box-sizing: border-box;
        }

        input:focus { border-color: #ffae00; }

        /* Sensi UI Layout */
        .sensi-box {
            border: 1px solid #222;
            background: #111;
        }

        .row {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #222;
        }

        .active-row {
            outline: 1.5px solid #ffae00;
            background: rgba(255, 174, 0, 0.05);
        }

        .label { flex: 2; font-size: 15px; text-transform: capitalize; }
        .val { flex: 0.5; text-align: right; padding-right: 15px; font-weight: bold; color: #fff; font-size: 18px; }

        .slider {
            flex: 3;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sq { width: 22px; height: 22px; background: #2a2a2a; display: flex; justify-content: center; align-items: center; border: 1px solid #444; }
        .bar { flex-grow: 1; height: 4px; background: #333; position: relative; }
        .fill { height: 100%; background: #ffae00; position: absolute; }
        .dot { width: 8px; height: 16px; background: #fff; position: absolute; top: -6px; border: 1px solid #000; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="color: #ffae00; letter-spacing: 2px; margin-bottom: 10px;">SENSITIVITY</h2>
    </div>

    <div class="search-area">
        <input type="text" id="phoneInput" placeholder="Type Phone Model (e.g. iPhone X, Vivo Y20)" oninput="handleSensi()">
    </div>

    <div id="result" class="sensi-box" style="display: none;">
        </div>
</div>

<script>
    function handleSensi() {
        const model = document.getElementById('phoneInput').value.trim();
        const resDiv = document.getElementById('result');

        if (model.length < 2) {
            resDiv.style.display = 'none';
            return;
        }

        resDiv.style.display = 'block';

        // Hash system for consistency
        let hash = 0;
        for (let i = 0; i < model.length; i++) {
            hash = model.charCodeAt(i) + ((hash << 5) - hash);
        }

        const isIphone = model.toLowerCase().includes("iphone") || model.toLowerCase().includes("apple");

        const getVal = (seed, min, max) => {
            const val = Math.abs(Math.sin(hash + seed) * (max - min) + min);
            return Math.floor(val);
        };

        // iPhone er General 50-80, baki gulo normal
        const settings = [
            { name: "General", val: isIphone ? getVal(1, 50, 80) : getVal(1, 95, 100) },
            { name: "Red Dot", val: getVal(2, 85, 98) },
            { name: "2x Scope", val: getVal(3, 80, 95) },
            { name: "4x Scope", val: getVal(4, 75, 92) },
            { name: "Sniper Scope", val: getVal(5, 40, 60) },
            { name: "Free Camera Button", val: getVal(6, 50, 90) }
        ];

        resDiv.innerHTML = '';
        settings.forEach((s, i) => {
            const row = document.createElement('div');
            row.className = `row ${i === 0 ? 'active-row' : ''}`;
            row.innerHTML = `
                <div class="label">${s.name}</div>
                <div class="val">${s.val}</div>
                <div class="slider">
                    <div class="sq">-</div>
                    <div class="bar">
                        <div class="fill" style="width: ${s.val}%"></div>
                        <div class="dot" style="left: ${s.val}%"></div>
                    </div>
                    <div class="sq">+</div>
                </div>
            `;
            resDiv.appendChild(row);
        });
    }
</script>

</body>
</html>
