<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium EXE Software UI</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            /* Premium Dark Charcoal Background */
            background: radial-gradient(circle at center, #1a252f 0%, #080a0c 100%);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        /* --- Highly Optimized Navbar --- */
        .nav-bar {
            display: flex;
            align-items: center;
            /* Ultra-premium Frosted Dark Glass */
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            padding: 10px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            gap: 6px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.6);
            /* Essential for smooth animation */
            will-change: transform, backdrop-filter;
        }

        /* --- Nav Item Styling (Base) --- */
        .nav-item {
            position: relative;
            display: flex;
            align-items: center;
            padding: 14px 24px;
            border-radius: 100px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.5); /* Dimmed state */
            text-decoration: none;
            user-select: none;
            transition: color 0.3s ease;
            /* Smooth transitions hint */
            will-change: transform;
        }

        /* --- Individual Active Back Layer --- */
        .nav-item::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #ffffff; /* White background for highlight */
            border-radius: 100px;
            z-index: -1;
            opacity: 0;
            /* High-Performance Scaling for smoothness */
            transform: scale(0.85); 
            transition: transform 0.4s cubic-bezier(0.23, 1, 0.32, 1), opacity 0.25s ease;
            will-change: transform, opacity;
        }

        .nav-item i {
            font-size: 26px;
            transition: transform 0.3s ease;
        }

        .nav-item span {
            font-size: 16px;
            font-weight: 700;
            margin-left: 0;
            width: 0;
            overflow: hidden;
            display: inline-block;
            transition: width 0.4s cubic-bezier(0.23, 1, 0.32, 1), margin 0.3s ease, opacity 0.2s ease;
            opacity: 0;
            white-space: nowrap;
        }

        /* --- High-Performance Active States --- */
        .nav-item.active {
            color: #000; /* Contrast text against white bg */
            will-change: transform;
        }

        .nav-item.active::before {
            opacity: 1;
            transform: scale(1); /* Dynamic scale-up for premium look */
        }

        /* Fixed text widths for smoothness */
        .nav-item.active .home-text {
            width: 60px;
            margin-left: 10px;
            opacity: 1;
        }

        .nav-item.active .exe-text {
            width: 50px; /* Specific width for "EXE" to be tight */
            margin-left: 10px;
            opacity: 1;
        }

        .nav-item.active .files-text {
            width: 60px;
            margin-left: 10px;
            opacity: 1;
        }

        .nav-item.active .chat-text {
            width: 60px;
            margin-left: 10px;
            opacity: 1;
        }

        /* Subtle depth scaling on icon */
        .nav-item.active i {
            transform: scale(0.92);
        }

        /* Instant Hover Feedback */
        .nav-item:hover:not(.active) {
            color: #fff;
            background: rgba(255,255,255,0.03);
        }

    </style>
</head>
<body>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="switchTab(this)">
            <i class='bx bx-home-alt-2'></i>
            <span class="home-text">Home</span>
        </div>

        <div class="nav-item" onclick="switchTab(this)">
            <i class='bx bx-terminal'></i>
            <span class="exe-text">EXE</span>
        </div>

        <div class="nav-item" onclick="switchTab(this)">
            <i class='bx bx-folder'></i>
            <span class="files-text">Files</span>
        </div>

        <div class="nav-item" onclick="switchTab(this)">
            <i class='bx bx-message-square-dots'></i>
            <span class="chat-text">Chat</span>
        </div>
    </nav>

    <script>
        // High-Performance Tab Switching
        function switchTab(el) {
            const currentActive = document.querySelector('.nav-item.active');
            
            // Do nothing if same tab is clicked
            if (currentActive === el) return;

            // Instant class removal for responsiveness
            currentActive.classList.remove('active');
            // Instant class add
            el.classList.add('active');
        }
    </script>

</body>
</html>
