<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Sensi Finder | Clean Search</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Segoe UI', Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: #111;
            padding: 25px;
            border-radius: 8px;
            border: 1px solid #222;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #ff9900;
            margin-bottom: 20px;
        }

        .search-box {
            position: relative;
            margin-bottom: 25px;
        }

        #phoneInput {
            width: 100%;
            padding: 15px;
            background: #1a1a1a;
            border: 1px solid #333;
            color: #fff;
            border-radius: 4px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }

        #phoneInput:focus { border-color: #ff9900; }

        #suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #1e1e1e;
            border: 1px solid #333;
            max-height: 300px;
            overflow-y: auto;
            z-index: 999;
            display: none;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }

        .suggestion-item {
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid #282828;
            font-size: 15px;
        }

        .suggestion-item:hover { background: #ff9900; color: #000; }

        /* FF Reality UI (Same as your Image) */
        .sensi-box { border: 1px solid #222; background: #0c0c0c; }

        .row {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #222;
        }

        .active-row {
            outline: 2px solid #ff990055;
            background: rgba(255, 153, 0, 0.05);
        }

        .label { flex: 2; font-size: 14px; color: #bbb; text-transform: uppercase; }
        .val { flex: 0.5; text-align: right; padding-right: 15px; font-weight: bold; font-size: 20px; color: #fff; }

        .slider { flex: 3; display: flex; align-items: center; gap: 8px; }
        .sq { width: 22px; height: 22px; background: #222; border: 1px solid #444; display: flex; justify-content: center; align-items: center; }
        .bar { flex-grow: 1; height: 4px; background: #333; position: relative; }
        .fill { height: 100%; background: #ff9900; position: absolute; }
        .dot { width: 8px; height: 18px; background: #fff; position: absolute; top: -7px; border: 1px solid #000; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="color: #ff9900; letter-spacing: 2px; margin-bottom: 10px; text-transform: uppercase;">Sensitivity</h2>
    </div>

    <div class="search-box">
        <input type="text" id="phoneInput" placeholder="Search phone (e.g. Vivo Y20, iPhone X)" autocomplete="off">
        <div id="suggestions"></div>
    </div>

    <div id="result" class="sensi-box" style="display: none;"></div>
</div>

<script>
    const input = document.getElementById('phoneInput');
    const suggBox = document.getElementById('suggestions');

    input.addEventListener('input', function() {
        const query = this.value;
        if (query.length < 2) {
            suggBox.style.display = 'none';
            return;
        }

        const script = document.createElement('script');
        // Search queries specifically for phone models
        script.src = `https://suggestqueries.google.com/complete/search?client=firefox&q=${encodeURIComponent(query)}&callback=handleSuggest`;
        document.body.appendChild(script);
        document.body.removeChild(script);
    });

    window.handleSuggest = function(data) {
        const results = data[1];
        if (results.length > 0) {
            suggBox.innerHTML = '';
            suggBox.style.display = 'block';
            
            results.slice(0, 10).forEach(item => {
                // Garbage text (Price, Specs, etc.) remove korar logic
                let cleanName = item.split(" price")[0]
                                   .split(" specs")[0]
                                   .split(" review")[0]
                                   .split(" details")[0]
                                   .split(" bd price")[0]
                                   .split(" camera")[0];

                const d = document.createElement('div');
                d.className = 'suggestion-item';
                d.innerText = cleanName;
                d.onclick = () => {
                    input.value = cleanName;
                    suggBox.style.display = 'none';
                    showSensi(cleanName);
                };
                suggBox.appendChild(d);
            });
        } else {
            suggBox.style.display = 'none';
        }
    };

    function showSensi(model) {
        const resDiv = document.getElementById('result');
        resDiv.style.display = 'block';

        let hash = 0;
        for (let i = 0; i < model.length; i++) {
            hash = model.charCodeAt(i) + ((hash << 5) - hash);
        }

        const isIphone = model.toLowerCase().includes("iphone") || model.toLowerCase().includes("apple");
        const getVal = (seed, min, max) => Math.floor(Math.abs(Math.sin(hash + seed) * (max - min) + min));

        // 200 Max Scale
        const settings = [
            { name: "General", val: isIphone ? getVal(1, 80, 135) : getVal(1, 185, 200) },
            { name: "Red Dot", val: getVal(2, 175, 198) },
            { name: "2x Scope", val: getVal(3, 160, 195) },
            { name: "4x Scope", val: getVal(4, 150, 190) },
            { name: "Sniper Scope", val: getVal(5, 70, 115) },
            { name: "Free Look", val: getVal(6, 100, 185) }
        ];

        resDiv.innerHTML = '';
        settings.forEach((s, i) => {
            const row = document.createElement('div');
            row.className = `row ${i === 0 ? 'active-row' : ''}`;
            const progress = (s.val / 200) * 100;
            row.innerHTML = `
                <div class="label">${s.name}</div>
                <div class="val">${s.val}</div>
                <div class="slider">
                    <div class="sq">-</div>
                    <div class="bar"><div class="fill" style="width: ${progress}%"></div><div class="dot" style="left: ${progress}%"></div></div>
                    <div class="sq">+</div>
                </div>
            `;
            resDiv.appendChild(row);
        });
    }

    document.addEventListener('click', (e) => {
        if (e.target !== input) suggBox.style.display = 'none';
    });
</script>

</body>
</html>
