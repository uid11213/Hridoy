<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>3D Smart Feed</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body {
            background: radial-gradient(circle at top left, #1e293b, #0f172a);
            min-height: 100vh;
            perspective: 1000px;
        }
        .glass-card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 45px rgba(0,0,0,0.2);
            transform-style: preserve-3d;
            transition: transform 0.5s ease;
        }
        .glass-card:hover {
            transform: translateZ(20px) rotateX(2deg);
        }
        .admin-glow {
            box-shadow: 0 0 20px rgba(59, 130, 246, 0.5);
        }
    </style>
</head>
<body x-data="{ 
    isAdmin: false, 
    showLogin: false, 
    pass: '', 
    posts: [
        {title: 'Welcome to the Feed', img: 'https://picsum.photos/600/400?random=1'},
        {title: '3D UI Concept', img: 'https://picsum.photos/600/400?random=2'}
    ],
    checkPass() {
        if(this.pass === '1234') { // Ekhane tomar password daw
            this.isAdmin = true;
            this.showLogin = false;
        } else {
            alert('Wrong Password!');
        }
    }
}" class="text-white font-sans p-4">

    <nav class="flex justify-between items-center max-w-4xl mx-auto py-6">
        <h1 class="text-2xl font-bold italic tracking-wider">SMART<span class="text-blue-500">FEED</span></h1>
        <button @click="showLogin = !showLogin" class="bg-blue-600 px-6 py-2 rounded-full hover:bg-blue-700 transition">
            <i class="fa-solid fa-user-shield mr-2"></i> Admin Panel
        </button>
    </nav>

    <div x-show="showLogin" class="fixed inset-0 bg-black/80 flex items-center justify-center z-50">
        <div class="glass-card p-8 rounded-2xl w-80 text-center">
            <h2 class="mb-4 font-bold">Admin Password</h2>
            <input type="password" x-model="pass" class="w-full p-2 rounded bg-gray-800 border border-gray-600 mb-4 focus:outline-none">
            <div class="flex gap-2">
                <button @click="checkPass()" class="flex-1 bg-green-600 py-2 rounded hover:bg-green-700">Enter</button>
                <button @click="showLogin = false" class="flex-1 bg-gray-600 py-2 rounded">Cancel</button>
            </div>
        </div>
    </div>

    <main class="max-w-xl mx-auto mt-10">
        
        <template x-if="isAdmin">
            <div class="glass-card p-6 rounded-3xl mb-10 admin-glow">
                <h3 class="text-blue-400 font-bold mb-4">Post Management</h3>
                <input type="text" placeholder="Post Title" id="postTitle" class="w-full bg-gray-800 p-3 rounded-lg mb-3">
                <input type="text" placeholder="Image URL" id="postImg" class="w-full bg-gray-800 p-3 rounded-lg mb-3">
                <button @click="posts.unshift({title: document.getElementById('postTitle').value, img: document.getElementById('postImg').value})" 
                    class="w-full bg-blue-500 py-3 rounded-lg font-bold hover:bg-blue-400 transition">
                    Push to Feed
                </button>
                <button @click="isAdmin = false" class="text-xs mt-4 text-gray-400 underline">Logout Admin</button>
            </div>
        </template>

        <div class="space-y-8">
            <template x-for="post in posts">
                <div class="glass-card p-4 rounded-3xl overflow-hidden">
                    <img :src="post.img" class="w-full h-64 object-cover rounded-2xl mb-4 shadow-lg" alt="feed image">
                    <div class="px-2">
                        <p class="text-lg font-medium" x-text="post.title"></p>
                        <div class="flex gap-4 mt-3 text-gray-400">
                            <i class="fa-regular fa-heart cursor-pointer hover:text-red-500"></i>
                            <i class="fa-regular fa-comment cursor-pointer hover:text-blue-500"></i>
                        </div>
                    </div>
                </div>
            </template>
        </div>
    </main>

</body>
</html>
