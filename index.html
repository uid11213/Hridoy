<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Sliding UI</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: #050708;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 10px solid #1a1d21; /* 4-Dike Border */
        }

        /* --- Content Area --- */
        .content-wrapper {
            flex: 1;
            position: relative;
        }

        .section {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            align-items: center; justify-content: center;
            padding: 20px; text-align: center;
            opacity: 0; visibility: hidden;
            transform: translate3d(0, 15px, 0);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .section.active {
            opacity: 1; visibility: visible;
            transform: translate3d(0, 0, 0);
        }

        .profile-img {
            width: 100px; height: 100px;
            border-radius: 50%; border: 3px solid rgba(255,255,255,0.1);
            margin-bottom: 20px; object-fit: cover;
        }

        /* --- Sliding Nav Bar --- */
        .nav-wrapper {
            position: fixed;
            bottom: 30px; left: 0; right: 0;
            display: flex; justify-content: center;
            z-index: 1000;
        }

        .nav-bar {
            position: relative;
            display: flex;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 6px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            box-shadow: 0 20px 40px rgba(0,0,0,0.6);
        }

        /* Moving Indicator (The Pill) */
        .nav-indicator {
            position: absolute;
            height: calc(100% - 12px);
            top: 6px; left: 6px;
            background: #ffffff;
            border-radius: 100px;
            z-index: 1;
            /* Ultra smooth sliding animation */
            transition: all 0.5s cubic-bezier(0.23, 1, 0.32, 1.2); 
            will-change: transform, width, left;
        }

        .nav-item {
            position: relative;
            display: flex; align-items: center;
            padding: 10px 18px;
            border-radius: 100px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.5);
            z-index: 2; /* Text icon shada background er upor thakbe */
            transition: color 0.3s ease;
            -webkit-tap-highlight-color: transparent;
        }

        .nav-item i { font-size: 22px; }

        .nav-item span {
            font-size: 14px; font-weight: 700;
            width: 0; opacity: 0; overflow: hidden;
            transition: all 0.4s cubic-bezier(0.23, 1, 0.32, 1);
            white-space: nowrap;
        }

        /* Active State Color */
        .nav-item.active { color: #000; }
        .nav-item.active span { width: 42px; margin-left: 8px; opacity: 1; }

    </style>
</head>
<body>

    <div class="content-wrapper">
        <section id="home" class="section active">
            <img src="https://via.placeholder.com/150" class="profile-img">
            <h1>Eiroko Profile</h1>
            <p>Welcome to home! Everything is smooth and sliding.</p>
        </section>

        <section id="exe" class="section">
            <i class='bx bx-terminal' style="font-size: 50px; margin-bottom: 15px;"></i>
            <h1>Software EXE</h1>
            <p>Your programs are here.</p>
        </section>

        <section id="files" class="section">
            <i class='bx bx-folder' style="font-size: 50px; margin-bottom: 15px;"></i>
            <h1>File Storage</h1>
            <p>All your data is safe.</p>
        </section>

        <section id="chat" class="section">
            <i class='bx bx-message-square-dots' style="font-size: 50px; margin-bottom: 15px;"></i>
            <h1>Chat Box</h1>
            <p>Real-time messaging.</p>
        </section>
    </div>

    <div class="nav-wrapper">
        <nav class="nav-bar" id="navBar">
            <div class="nav-indicator" id="indicator"></div>

            <div class="nav-item active" onclick="navigate('home', this)">
                <i class='bx bx-home-alt-2'></i>
                <span>Home</span>
            </div>
            <div class="nav-item" onclick="navigate('exe', this)">
                <i class='bx bx-terminal'></i>
                <span>EXE</span>
            </div>
            <div class="nav-item" onclick="navigate('files', this)">
                <i class='bx bx-folder'></i>
                <span>Files</span>
            </div>
            <div class="nav-item" onclick="navigate('chat', this)">
                <i class='bx bx-message-square-dots'></i>
                <span>Chat</span>
            </div>
        </nav>
    </div>

    <script>
        const indicator = document.getElementById('indicator');

        function moveIndicator(el) {
            // Get clicked element's size and position
            const rect = el.getBoundingClientRect();
            const parentRect = el.parentElement.getBoundingClientRect();
            
            // Apply size and position to the white pill
            indicator.style.width = el.offsetWidth + 'px';
            indicator.style.left = el.offsetLeft + 'px';
        }

        function navigate(id, el) {
            // 1. Update Navigation items
            document.querySelectorAll('.nav-item').forEach(item => item.classList.remove('active'));
            el.classList.add('active');

            // 2. Slide the indicator
            moveIndicator(el);

            // 3. Switch Sections
            document.querySelectorAll('.section').forEach(sec => sec.classList.remove('active'));
            document.getElementById(id).classList.add('active');
        }

        // Initialize indicator position on page load
        window.onload = () => {
            const activeItem = document.querySelector('.nav-item.active');
            moveIndicator(activeItem);
        };
    </script>

</body>
</html>
