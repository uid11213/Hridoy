<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>REDBOT Shop | Modern E-commerce</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #f4f4f9;
            color: #333;
        }

        /* Navigation */
        nav {
            background: #222;
            color: white;
            padding: 15px 5%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            color: #ff4757;
        }

        /* Hero Section */
        .hero {
            background: linear-gradient(rgba(0,0,0,0.6), rgba(0,0,0,0.6)), url('https://images.unsplash.com/photo-1550745165-9bc0b252726f?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            height: 60vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: white;
            text-align: center;
            padding: 0 20px;
        }

        .hero h1 { font-size: 3rem; margin-bottom: 10px; }
        .hero p { font-size: 1.2rem; margin-bottom: 20px; }

        /* Product Section */
        .container {
            padding: 50px 10%;
        }

        .section-title {
            text-align: center;
            margin-bottom: 40px;
            font-size: 28px;
        }

        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 25px;
        }

        .product-card {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
            transition: transform 0.3s;
        }

        .product-card:hover {
            transform: translateY(-5px);
        }

        .product-img {
            width: 100%;
            height: 200px;
            background: #ddd;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .product-info {
            padding: 20px;
            text-align: center;
        }

        .price {
            color: #ff4757;
            font-size: 20px;
            font-weight: bold;
            margin: 10px 0;
        }

        .buy-btn {
            background: #2ed573;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-weight: bold;
        }

        /* Footer */
        footer {
            background: #222;
            color: white;
            text-align: center;
            padding: 20px;
            margin-top: 50px;
        }
    </style>
</head>
<body>

    <nav>
        <div class="logo">REDBOT SHOP</div>
        <div>
            <i class="fas fa-shopping-cart"></i>
        </div>
    </nav>

    <header class="hero">
        <h1>Exclusive Gadgets Collection</h1>
        <p>Best products at the most affordable price in Bangladesh.</p>
        <a href="#products" class="buy-btn" style="background: #ff4757;">Shop Now</a>
    </header>

    <div class="container" id="products">
        <h2 class="section-title">Feature Products</h2>
        
        <div class="product-grid">
            <div class="product-card">
                <div class="product-img">
                    <i class="fas fa-headphones fa-4x" style="color: #555;"></i>
                </div>
                <div class="product-info">
                    <h3>Wireless Headphone</h3>
                    <p class="price">1,250 BDT</p>
                    <a href="https://wa.me/8801XXXXXXXXX?text=I%20want%20to%20buy%20Wireless%20Headphone" class="buy-btn">
                        <i class="fab fa-whatsapp"></i> Order Now
                    </a>
                </div>
            </div>

            <div class="product-card">
                <div class="product-img">
                    <i class="fas fa-watch fa-4x" style="color: #555;"></i>
                </div>
                <div class="product-info">
                    <h3>Smart Watch V8</h3>
                    <p class="price">1,800 BDT</p>
                    <a href="#" class="buy-btn"><i class="fab fa-whatsapp"></i> Order Now</a>
                </div>
            </div>

            <div class="product-card">
                <div class="product-img">
                    <i class="fas fa-mouse fa-4x" style="color: #555;"></i>
                </div>
                <div class="product-info">
                    <h3>Gaming Mouse</h3>
                    <p class="price">850 BDT</p>
                    <a href="#" class="buy-btn"><i class="fab fa-whatsapp"></i> Order Now</a>
                </div>
            </div>
        </div>
    </div>

    <footer>
        <p>&copy; 2026 REDBOT Shop. All rights reserved.</p>
    </footer>

</body>
</html>
