<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Liquid Glass Hub</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --glass-bg: rgba(255, 255, 255, 0.08);
            --glass-border: rgba(255, 255, 255, 0.15);
            --silver-text: #e0e0e0;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%);
            color: #fff;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* No scroll */
        }

        /* 3D Moving Liquid Orbs */
        .orb {
            position: absolute;
            filter: blur(80px);
            z-index: -1;
            border-radius: 50%;
            opacity: 0.5;
            animation: float 15s infinite alternate;
        }
        .orb-1 { width: 300px; height: 300px; background: #333; top: -10%; left: -10%; }
        .orb-2 { width: 250px; height: 250px; background: #1a1a1a; bottom: -5%; right: -5%; }

        @keyframes float {
            0% { transform: translate(0, 0) scale(1); }
            100% { transform: translate(50px, 50px) scale(1.1); }
        }

        /* Main Glass Container */
        .glass-container {
            width: 90%;
            max-width: 400px;
            height: 90vh; /* Fits perfectly on phone screen */
            background: var(--glass-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 40px;
            padding: 25px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            box-shadow: 0 40px 60px rgba(0,0,0,0.5), inset 0 0 20px rgba(255,255,255,0.05);
            position: relative;
        }

        /* Header & Clock */
        .header {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
        }

        #clock {
            font-size: 1rem;
            font-weight: 700;
            background: rgba(255,255,255,0.1);
            padding: 8px 15px;
            border-radius: 20px;
            letter-spacing: 1px;
            color: var(--silver-text);
        }

        /* Profile Area */
        .profile-section {
            text-align: center;
            margin-top: -10px;
        }

        .profile-wrap {
            position: relative;
            display: inline-block;
        }

        .profile-img {
            width: 100px;
            height: 100px;
            border-radius: 30px;
            object-fit: cover;
            border: 1px solid var(--glass-border);
            box-shadow: 0 10px 25px rgba(0,0,0,0.3);
        }

        /* Glass Buttons Grid */
        .social-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .glass-btn {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--glass-border);
            padding: 15px;
            border-radius: 20px;
            text-decoration: none;
            color: var(--silver-text);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-size: 0.9rem;
            transition: all 0.3s;
        }

        .glass-btn:active {
            transform: scale(0.95);
            background: rgba(255,255,255,0.1);
        }

        .glass-btn i { font-size: 1.2rem; }

        /* Help/Utility Section (The Return Hook) */
        .utility-box {
            background: linear-gradient(135deg, rgba(255,255,255,0.1), rgba(255,255,255,0.02));
            border-radius: 25px;
            padding: 15px;
            border: 1px solid var(--glass-border);
        }

        .utility-box h3 { font-size: 0.85rem; margin-bottom: 5px; color: #fff; }
        .utility-box p { font-size: 0.75rem; opacity: 0.7; line-height: 1.3; }

        .btn-action {
            width: 100%;
            margin-top: 10px;
            padding: 10px;
            border-radius: 15px;
            border: none;
            background: #fff;
            color: #000;
            font-weight: 700;
            font-size: 0.8rem;
            cursor: pointer;
        }

        /* Status Dot */
        .status { font-size: 0.7rem; color: #00ff88; margin-top: 5px; }
    </style>
</head>
<body>

    <div class="orb orb-1"></div>
    <div class="orb orb-2"></div>

    <div class="glass-container">
        <div class="header">
            <div id="clock">00:00</div>
            <div style="font-size: 1.2rem; opacity: 0.5;"><i class="fas fa-ellipsis-v"></i></div>
        </div>

        <div class="profile-section">
            <div class="profile-wrap">
                <img src="https://via.placeholder.com/150" alt="Tarek" class="profile-img">
            </div>
            <h2 style="margin-top: 10px; letter-spacing: 1px;">REDBOT</h2>
            <div class="status"><i class="fas fa-circle" style="font-size: 0.5rem;"></i> Active Now</div>
        </div>

        <div class="social-grid">
            <a href="#" class="glass-btn"><i class="fab fa-whatsapp"></i> WhatsApp</a>
            <a href="#" class="glass-btn"><i class="fab fa-facebook-f"></i> Facebook</a>
            <a href="#" class="glass-btn"><i class="fab fa-telegram-plane"></i> Telegram</a>
            <a href="#" class="glass-btn"><i class="fab fa-instagram"></i> Instagram</a>
        </div>

        <div class="utility-box">
            <h3><i class="fas fa-magic"></i> Useful Resources</h3>
            <p>Ami ekhane protidin premium design tips ar tech help share kori. Kono help lagle click korun.</p>
            <button class="btn-action">Ask for Help</button>
        </div>
    </div>

    <script>
        // Real-time Clock
        function updateTime() {
            const now = new Date();
            const h = String(now.getHours()).padStart(2, '0');
            const m = String(now.getMinutes()).padStart(2, '0');
            document.getElementById('clock').textContent = `${h}:${m}`;
        }
        setInterval(updateTime, 1000);
        updateTime();

        // 3D Tilt Effect on Container
        const card = document.querySelector('.glass-container');
        document.addEventListener('mousemove', (e) => {
            let xAxis = (window.innerWidth / 2 - e.pageX) / 30;
            let yAxis = (window.innerHeight / 2 - e.pageY) / 30;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
    </script>
</body>
</html>
