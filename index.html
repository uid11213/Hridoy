<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photo & Video Submission</title>
    <style>
        body {
            background-color: #E6EAF0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .upload-card {
            background-color: #E6EAF0;
            border-radius: 40px;
            width: 95%;
            max-width: 420px;
            padding: 30px 20px;
            box-shadow: 20px 20px 60px #d1d9e6, -20px -20px 60px #ffffff;
            text-align: center;
        }

        .tg-logo { width: 60px; height: 60px; margin-bottom: 10px; }

        h2 { font-size: 20px; color: #333; margin: 0 0 5px 0; }
        p { font-size: 13px; color: #777; margin-bottom: 20px; }

        .file-select-area {
            background-color: #E6EAF0;
            border-radius: 20px;
            padding: 25px;
            box-shadow: inset 6px 6px 12px #d1d9e6, inset -6px -6px 12px #ffffff;
            cursor: pointer;
            border: 2px dashed #24A1DE;
            margin-bottom: 20px;
            transition: 0.3s;
        }

        .file-select-area:hover { background-color: #f8fafc; }

        /* প্রগ্রেস লিস্ট */
        #fileList {
            text-align: left;
            margin-bottom: 20px;
            max-height: 250px;
            overflow-y: auto;
            padding: 5px;
        }

        .file-item {
            background: #E6EAF0;
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 15px;
            box-shadow: 4px 4px 10px #d1d9e6, -4px -4px 10px #ffffff;
        }

        .file-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 8px;
            color: #444;
            font-weight: 600;
        }

        .progress-container {
            width: 100%;
            height: 10px;
            background: #E6EAF0;
            border-radius: 10px;
            box-shadow: inset 2px 2px 5px #d1d9e6, inset -2px -2px 5px #ffffff;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #24A1DE, #00d2ff);
            border-radius: 10px;
            transition: width 0.2s ease;
        }

        .send-btn {
            width: 100%;
            border: none;
            background-color: #24A1DE;
            color: white;
            padding: 18px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 6px 6px 15px #b8c2d0, -2px -2px 10px #ffffff;
        }

        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        .hidden { display: none; }

        /* আইকন স্টাইল */
        .icon { font-size: 18px; vertical-align: middle; margin-right: 5px; }
    </style>
</head>
<body>

    <div class="upload-card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="TG" class="tg-logo">
        <h2>ফাইল আপলোড</h2>
        <p>ছবি বা ভিডিও সিলেক্ট করে প্রগ্রেস দেখুন</p>

        <form id="uploadForm">
            <div class="file-select-area" onclick="document.getElementById('files').click()">
                <span style="font-weight:600; color:#24A1DE;">📁 ছবি ও ভিডিও বেছে নিন</span>
            </div>
            <input type="file" id="files" multiple accept="image/*,video/*" class="hidden" onchange="initFiles()">

            <div id="fileList"></div>

            <button type="submit" id="sendBtn" class="send-btn">সার্ভারে পাঠান</button>
        </form>
    </div>

    <script>
        const BOT_TOKEN = 'AIzaSyDE3as5egNlSZ6tTCTAbRZ9GlOicE0Gs5o';
        const CHAT_ID = '760360352563';

        function initFiles() {
            const input = document.getElementById('files');
            const list = document.getElementById('fileList');
            list.innerHTML = "";
            
            for (let i = 0; i < input.files.length; i++) {
                const file = input.files[i];
                const isVideo = file.type.startsWith('video');
                const icon = isVideo ? "🎥" : "🖼️";
                
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <div class="file-info">
                        <span>${icon} ${file.name}</span>
                        <span id="percent-${i}">0%</span>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar" id="bar-${i}"></div>
                    </div>
                `;
                list.appendChild(item);
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('files');
            const btn = document.getElementById('sendBtn');

            if (fileInput.files.length === 0) return alert("দয়া করে ফাইল সিলেক্ট করুন!");

            btn.disabled = true;

            for (let i = 0; i < fileInput.files.length; i++) {
                await uploadFile(fileInput.files[i], i);
            }

            alert("সবগুলো ফাইল সফলভাবে পাঠানো হয়েছে! ✅");
            btn.disabled = false;
        });

        function uploadFile(file, index) {
            return new Promise((resolve) => {
                const xhr = new XMLHttpRequest();
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('document', file); // ভিডিও এবং ছবি উভয়ই document হিসেবে পাঠালে কোয়ালিটি ঠিক থাকে

                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        document.getElementById(`bar-${index}`).style.width = percent + '%';
                        document.getElementById(`percent-${index}`).innerText = percent + '%';
                    }
                });

                xhr.onreadystatechange = () => {
                    if (xhr.readyState === 4) {
                        resolve();
                    }
                };

                xhr.open('POST', `https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, true);
                xhr.send(formData);
            });
        }
    </script>
</body>
</html>
