<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photo Studio - Auth</title>
    <style>
        body {
            background-color: #E6EAF0;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            overflow: hidden;
        }

        .auth-card {
            background-color: #E6EAF0;
            border-radius: 40px;
            width: 90%;
            max-width: 380px;
            padding: 40px 30px;
            box-shadow: 20px 20px 60px #d1d9e6, -20px -20px 60px #ffffff;
            text-align: center;
        }

        h2 { font-size: 28px; font-weight: 700; color: #333; margin-bottom: 5px; }
        p.subtitle { font-size: 14px; color: #888; margin-bottom: 25px; }

        .input-group { margin-bottom: 15px; text-align: left; }

        input {
            width: 100%;
            border: none;
            background-color: #E6EAF0;
            border-radius: 15px;
            padding: 15px 20px;
            box-sizing: border-box;
            box-shadow: inset 6px 6px 12px #d1d9e6, inset -6px -6px 12px #ffffff;
            font-size: 14px;
            color: #333;
            outline: none;
        }

        .submit-btn {
            width: 100%;
            border: none;
            background-color: #1A1A1A;
            color: white;
            padding: 15px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 6px 6px 12px #aaaaaa, -2px -2px 6px #ffffff;
            margin-top: 10px;
            transition: 0.2s;
        }

        .submit-btn:active { transform: scale(0.98); }
        .submit-btn:disabled { opacity: 0.5; }

        .toggle-text { margin-top: 25px; font-size: 13px; color: #666; }
        .toggle-link { color: #E91E63; font-weight: 700; cursor: pointer; }
        
        #message { margin-top: 15px; font-size: 12px; font-weight: 600; min-height: 18px; }
    </style>
</head>
<body>

    <div class="auth-card">
        <h2 id="title">স্বাগতম</h2>
        <p id="subtitle" class="subtitle">লগইন করে অ্যাকাউন্টে প্রবেশ করুন</p>

        <form id="authForm">
            <div class="input-group">
                <input type="email" id="email" placeholder="ইমেইল ঠিকানা" required>
            </div>
            <div class="input-group">
                <input type="password" id="password" placeholder="পাসওয়ার্ড" required>
            </div>

            <button type="submit" id="mainBtn" class="submit-btn">লগইন</button>
        </form>

        <div id="message"></div>

        <div class="toggle-text">
            <span id="textHint">অ্যাকাউন্ট নেই?</span> 
            <span id="toggleBtn" class="toggle-link" onclick="toggleMode()">রেজিস্টার করুন</span>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // আপনার দেওয়া কনফিগ
        const firebaseConfig = {
            apiKey: "AIzaSyDE3as5egNlSZ6tTCTAbRZ9GlOicE0Gs5o",
            authDomain: "hridoy-ahmed-2558d.firebaseapp.com",
            projectId: "hridoy-ahmed-2558d",
            storageBucket: "hridoy-ahmed-2558d.firebasestorage.app",
            messagingSenderId: "760360352563",
            appId: "1:760360352563:web:c0612db3c335004cd1dc46",
            measurementId: "G-G7JBD2WQDF"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        window.isLogin = true;

        window.toggleMode = function() {
            window.isLogin = !window.isLogin;
            document.getElementById('title').innerText = window.isLogin ? "স্বাগতম" : "নতুন অ্যাকাউন্ট";
            document.getElementById('subtitle').innerText = window.isLogin ? "লগইন করে অ্যাকাউন্টে প্রবেশ করুন" : "তথ্য দিয়ে অ্যাকাউন্ট তৈরি করুন";
            document.getElementById('mainBtn').innerText = window.isLogin ? "লগইন" : "রেজিস্টার";
            document.getElementById('textHint').innerText = window.isLogin ? "অ্যাকাউন্ট নেই?" : "আগে থেকেই অ্যাকাউন্ট আছে?";
            document.getElementById('toggleBtn').innerText = window.isLogin ? "রেজিস্টার করুন" : "লগইন করুন";
        };

        document.getElementById('authForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const pass = document.getElementById('password').value;
            const btn = document.getElementById('mainBtn');
            const msg = document.getElementById('message');

            btn.disabled = true;
            msg.innerText = "অপেক্ষা করুন...";
            msg.style.color = "#333";

            if (window.isLogin) {
                signInWithEmailAndPassword(auth, email, pass)
                .then((userCredential) => {
                    msg.innerText = "লগইন সফল!";
                    msg.style.color = "green";
                    // এখানে আপনি আপনার ড্যাশবোর্ড বা অর্ডার পেজের লিঙ্ক দিতে পারেন
                    // window.location.href = "dashboard.html"; 
                })
                .catch((error) => {
                    msg.innerText = "ভুল ইমেইল বা পাসওয়ার্ড!";
                    msg.style.color = "red";
                    btn.disabled = false;
                });
            } else {
                createUserWithEmailAndPassword(auth, email, pass)
                .then((userCredential) => {
                    msg.innerText = "রেজিস্ট্রেশন সফল! এখন লগইন করুন।";
                    msg.style.color = "green";
                    window.toggleMode();
                    btn.disabled = false;
                })
                .catch((error) => {
                    msg.innerText = "ব্যর্থ: " + error.message;
                    msg.style.color = "red";
                    btn.disabled = false;
                });
            }
        });
    </script>
</body>
</html>
