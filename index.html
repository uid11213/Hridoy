<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eiroko Music Store</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <script>
        // ==========================================
        // 🛠️ CONFIGURATION SETUP
        // ==========================================
        
        const MY_CONFIG = {
            // ১. প্রোফাইল সেটিংস
            name: "Eiroko Dev",                
            bio: "Musician & Developer", 
            profilePic: "https://i.ibb.co.com/n887bQCt/image.jpg", 
            // Cover Photo remove kora hoyeche, tai ekhane kichu dewar dorkar nei

            // ২. কন্টাক্ট সেটিংস
            whatsappNum: "8801700000000",      
            displayPhone: "+880 1700-000000",  
            facebookURL: "https://facebook.com/yourprofile", 

            // ৩. টেলিগ্রাম বোট সেটিংস
            botToken: "YOUR_BOT_TOKEN_HERE",   
            chatID: "YOUR_CHAT_ID_HERE"        
        };

        // ৪. আইটেম লিস্ট (Apnar dewa notun nam-gulo ekhane set kora hoyeche)
        const ITEM_LIST = [
            { name: "Signature Guitar 265", price: "15500", img: "https://i.ibb.co.com/ZpKH1d4n/image.jpg" }, 
            { name: "AXE 48c", price: "12000", img: "https://via.placeholder.com/150" },
            { name: "TGM", price: "9500", img: "https://via.placeholder.com/150" },
            { name: "Ukulele 26\"", price: "4500", img: "https://via.placeholder.com/150" },
            { name: "Ukulele 24\"", price: "3800", img: "https://via.placeholder.com/150" },
            { name: "Yemaha cm2", price: "18000", img: "https://via.placeholder.com/150" }
        ];

        // ==========================================
        // CONFIGURATION শেষ
        // ==========================================
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }
        
        body { 
            background: #000; 
            color: white; 
            height: 100vh; 
            display: flex; 
            flex-direction: column; 
            overflow: hidden; 
            border: 8px solid #111; 
        }

        .content-wrapper { 
            flex: 1; 
            position: relative; 
            width: 100%; 
            overflow-y: auto; 
            padding-bottom: 110px; 
            scroll-behavior: smooth;
        }

        .section { display: none; flex-direction: column; align-items: center; width: 100%; }
        .section.active { display: flex; animation: fadeIn 0.4s ease-out; }
        
        @keyframes fadeIn { 
            from { opacity: 0; transform: translateY(10px); } 
            to { opacity: 1; transform: translateY(0); } 
        }

        /* --- Cover Photo Removed & Header Adjusted --- */
        .header-spacer {
            width: 100%;
            height: 60px; /* Cover photo bade upor theke ektu faka */
            background: #000;
        }

        .profile-pic-wrapper { 
            margin-top: 20px;
            display: flex;
            justify-content: center;
        }
        .profile-pic { 
            width: 120px; 
            height: 120px; 
            border-radius: 50%; 
            border: 3px solid #00ff88; 
            object-fit: cover; 
            background: #222; 
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2); 
        }

        .home-info { text-align: center; margin-top: 20px; padding: 0 20px; }
        .home-info h1 { font-size: 28px; font-weight: 800; color: #fff; }
        .home-info p { color: #888; font-size: 15px; margin-top: 8px; }

        /* Shop Grid */
        .shop-grid { 
            display: grid; 
            grid-template-columns: repeat(2, 1fr); 
            gap: 15px; 
            width: 92%; 
            max-width: 500px; 
            margin-top: 25px; 
        }
        .item-card { 
            background: #0f0f0f; 
            border: 1px solid #1a1a1a; 
            border-radius: 24px; 
            padding: 15px; 
            text-align: center; 
            cursor: pointer; 
            transition: 0.3s; 
        }
        .item-card:active { transform: scale(0.95); background: #151515; }
        .item-img { 
            width: 100%; 
            height: 120px; 
            border-radius: 18px; 
            object-fit: cover; 
            margin-bottom: 12px; 
            background: #1a1a1a; 
        }
        .item-card h4 { font-size: 14px; font-weight: 600; color: #eee; margin-bottom: 5px; }
        .price-tag { color: #00ff88; font-weight: 800; font-size: 17px; }

        /* Contact Section */
        .contact-list { width: 90%; max-width: 400px; margin-top: 25px; }
        .contact-btn { 
            display: flex; 
            align-items: center; 
            justify-content: center; 
            padding: 18px; 
            border-radius: 20px; 
            margin-bottom: 15px; 
            text-decoration: none; 
            font-weight: 700; 
            gap: 12px; 
            font-size: 16px;
        }
        .whatsapp { background: #25D366; color: white; }
        .facebook { background: #1877F2; color: white; }
        
        .phone-highlight { 
            background: #0f0f0f; 
            border: 1px solid #222; 
            padding: 25px; 
            border-radius: 24px; 
            text-align: center; 
        }
        .phone-number { 
            display: block; 
            font-size: 24px; 
            font-weight: 800; 
            margin-top: 8px; 
            color: #fff; 
        }

        /* Nav & Modal */
        .nav-wrapper { position: fixed; bottom: 30px; left: 0; right: 0; display: flex; justify-content: center; z-index: 1000; }
        .nav-bar { display: flex; background: rgba(15, 15, 15, 0.9); backdrop-filter: blur(20px); padding: 8px; border-radius: 30px; border: 1px solid rgba(255, 255, 255, 0.1); gap: 10px; }
        .nav-item { padding: 12px 25px; border-radius: 25px; cursor: pointer; color: #555; transition: 0.3s; display: flex; align-items: center; gap: 8px; }
        .nav-item.active { color: #fff; background: rgba(255, 255, 255, 0.1); }
        .nav-item span { display: none; font-weight: 700; }
        .nav-item.active span { display: inline; }

        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.95); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal-content { background: #111; padding: 30px; border-radius: 30px; width: 100%; max-width: 370px; border: 1px solid #333; }
        input { width: 100%; padding: 15px; margin-bottom: 12px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 14px; outline: none; }
        .confirm-btn { width: 100%; padding: 16px; background: #fff; color: #000; border: none; border-radius: 14px; font-weight: 800; cursor: pointer; }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <section id="home" class="section active">
            <div class="header-spacer"></div>
            <div class="profile-pic-wrapper">
                <img id="userPic" src="" class="profile-pic" alt="Profile">
            </div>
            <div class="home-info">
                <h1 id="userName">Loading...</h1>
                <p id="userBio">...</p>
            </div>
        </section>

        <section id="buy" class="section">
            <h2 style="margin-top: 30px; font-weight: 800;">Available Instruments</h2>
            <p style="color:#555; font-size: 13px; margin-bottom: 10px;">Select to Order</p>
            <div class="shop-grid" id="itemGrid"></div>
        </section>

        <section id="chat" class="section">
            <h2 style="margin-top: 35px; font-weight: 800;">Contact Me</h2>
            <div class="contact-list">
                <a id="waBtn" href="#" class="contact-btn whatsapp"><i class='bx bxl-whatsapp' style="font-size:24px"></i> WhatsApp</a>
                <a id="fbBtn" href="#" class="contact-btn facebook"><i class='bx bxl-facebook-circle' style="font-size:24px"></i> Facebook</a>
                <div class="phone-highlight">
                    <span style="color: #444; font-size: 11px; letter-spacing: 2px; font-weight: 800;">DIRECT CALL</span>
                    <span id="phoneDisplay" class="phone-number">000000000</span>
                </div>
            </div>
        </section>
    </div>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h3 id="itemTitle" style="text-align:center; margin-bottom:5px;">Order</h3>
            <p id="itemPriceDisplay" style="text-align:center; color:#00ff88; margin-bottom:25px; font-weight:800; font-size:18px;"></p>
            <input type="text" id="orderName" placeholder="Apnar Nam">
            <input type="text" id="orderAddress" placeholder="Thikana">
            <input type="text" id="orderWhatsapp" placeholder="WhatsApp Number">
            <button class="confirm-btn" onclick="sendOrder()">Confirm Order</button>
            <button onclick="closeModal()" style="width:100%; background:none; border:none; color:#555; margin-top:15px; cursor:pointer;">Cancel</button>
        </div>
    </div>

    <div class="nav-wrapper">
        <nav class="nav-bar">
            <div class="nav-item active" onclick="navTo('home', this)"><i class='bx bx-home-alt-2'></i><span>Home</span></div>
            <div class="nav-item" onclick="navTo('buy', this)"><i class='bx bx-shopping-bag'></i><span>Shop</span></div>
            <div class="nav-item" onclick="navTo('chat', this)"><i class='bx bx-message-square-dots'></i><span>Chat</span></div>
        </nav>
    </div>

    <script>
        document.getElementById('userName').innerText = MY_CONFIG.name;
        document.getElementById('userBio').innerText = MY_CONFIG.bio;
        document.getElementById('userPic').src = MY_CONFIG.profilePic;
        document.getElementById('waBtn').href = `https://wa.me/${MY_CONFIG.whatsappNum}`;
        document.getElementById('fbBtn').href = MY_CONFIG.facebookURL;
        document.getElementById('phoneDisplay').innerText = MY_CONFIG.displayPhone;

        const grid = document.getElementById('itemGrid');
        ITEM_LIST.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.onclick = () => openModal(item.name, item.price);
            card.innerHTML = `
                <img src="${item.img}" class="item-img" alt="${item.name}">
                <h4>${item.name}</h4>
                <p class="price-tag">${item.price} ৳</p>
            `;
            grid.appendChild(card);
        });

        function navTo(id, el) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
        }

        function openModal(name, price) {
            document.getElementById('itemTitle').innerText = name;
            document.getElementById('itemPriceDisplay').innerText = "৳ " + price;
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('orderModal').style.display = 'none'; }

        function sendOrder() {
            const n = document.getElementById('orderName').value;
            const a = document.getElementById('orderAddress').value;
            const w = document.getElementById('orderWhatsapp').value;
            if(!n || !a || !w) return alert("Sob totho din");
            
            const msg = `🛍️ *New Order!*%0AItem: ${document.getElementById('itemTitle').innerText}%0APrice: ${document.getElementById('itemPriceDisplay').innerText}%0AName: ${n}%0AAddress: ${a}%0AWA: ${w}`;
            fetch(`https://api.telegram.org/bot${MY_CONFIG.botToken}/sendMessage?chat_id=${MY_CONFIG.chatID}&text=${msg}&parse_mode=Markdown`)
            .then(() => { alert("Order successfully sent!"); closeModal(); });
        }
    </script>
</body>
</html>
