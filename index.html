<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eiroko Premium UI</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, sans-serif;
        }

        body {
            /* Premium Dark Gradient Background */
            background: radial-gradient(circle at top left, #2c3e50, #000000);
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Navbar Container --- */
        .nav-bar {
            display: flex;
            align-items: center;
            /* Semi-transparent Dark Glass */
            background: rgba(255, 255, 255, 0.1); 
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            padding: 10px;
            border-radius: 60px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            gap: 8px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        /* --- Default Nav Item --- */
        .nav-item {
            display: flex;
            align-items: center;
            padding: 14px 22px;
            border-radius: 50px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.6); /* Fakase shada/grey */
            transition: all 0.3s ease;
            text-decoration: none;
        }

        .nav-item i {
            font-size: 26px;
        }

        .nav-item span {
            font-size: 16px;
            font-weight: 600;
            margin-left: 0;
            max-width: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.3s ease;
            white-space: nowrap;
        }

        /* --- Active State (Premium Highlight) --- */
        .nav-item.active {
            background: #ffffff; /* Shada background for focus */
            color: #111111; /* Deep Black Text/Icon */
            box-shadow: 0 10px 20px rgba(255, 255, 255, 0.1);
        }

        .nav-item.active span {
            margin-left: 10px;
            max-width: 100px;
            opacity: 1;
        }

        /* Hover Effect */
        .nav-item:hover:not(.active) {
            color: #ffffff;
            background: rgba(255, 255, 255, 0.05);
        }

    </style>
</head>
<body>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="selectItem(this)">
            <i class='bx bx-home-alt-2'></i>
            <span>Home</span>
        </div>

        <div class="nav-item" onclick="selectItem(this)">
            <i class='bx bx-grid-alt'></i>
            <span>Apps</span>
        </div>

        <div class="nav-item" onclick="selectItem(this)">
            <i class='bx bx-folder'></i>
            <span>Files</span>
        </div>

        <div class="nav-item" onclick="selectItem(this)">
            <i class='bx bx-comment-dots'></i>
            <span>Chat</span>
        </div>
    </nav>

    <script>
        function selectItem(el) {
            // Shobar active class muche fela
            const allItems = document.querySelectorAll('.nav-item');
            allItems.forEach(item => item.classList.remove('active'));
            
            // Clicked item-ke active kora
            el.classList.add('active');
        }
    </script>

</body>
</html>
