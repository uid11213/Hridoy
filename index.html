<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Sensi Finder | Global Search</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #dcdcdc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 15px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: #111;
            padding: 20px;
            border-radius: 10px;
            border: 1px solid #222;
        }

        .header {
            text-align: center;
            margin-bottom: 20px;
            border-bottom: 2px solid #ff9900;
        }

        /* Smart Search Box */
        .search-box {
            position: relative;
            margin-bottom: 25px;
        }

        #phoneInput {
            width: 100%;
            padding: 15px;
            background: #1e1e1e;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
            font-size: 16px;
            outline: none;
            box-sizing: border-box;
        }

        #phoneInput:focus { border-color: #ff9900; }

        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #1a1a1a;
            border: 1px solid #333;
            max-height: 200px;
            overflow-y: auto;
            z-index: 1000;
            display: none;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }

        .suggestions div {
            padding: 12px;
            cursor: pointer;
            border-bottom: 1px solid #282828;
            font-size: 14px;
            color: #bbb;
        }

        .suggestions div:hover { background: #ff9900; color: #000; }

        /* FF Realistic Design */
        .sensi-box { border: 1px solid #222; background: #0f0f0f; }

        .row {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #222;
        }

        .active-row {
            outline: 2px solid #ff990066;
            background: rgba(255, 153, 0, 0.05);
        }

        .label { flex: 2; font-size: 14px; color: #ccc; }
        .val { flex: 0.5; text-align: right; padding-right: 15px; font-weight: bold; font-size: 18px; color: #fff; }

        .slider { flex: 3; display: flex; align-items: center; gap: 8px; }
        .sq { width: 22px; height: 22px; background: #2a2a2a; border: 1px solid #444; display: flex; justify-content: center; align-items: center; }
        .bar { flex-grow: 1; height: 4px; background: #333; position: relative; }
        .fill { height: 100%; background: #ff9900; position: absolute; }
        .dot { width: 8px; height: 16px; background: #fff; position: absolute; top: -6px; border: 1px solid #000; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="color: #ff9900; letter-spacing: 2px; margin-bottom: 10px; text-transform: uppercase;">Sensitivity</h2>
    </div>

    <div class="search-box">
        <input type="text" id="phoneInput" placeholder="Type model (e.g. iPhone, Samsung, Redmi)" autocomplete="off">
        <div id="suggestions" class="suggestions"></div>
    </div>

    <div id="result" class="sensi-box" style="display: none;">
        </div>
</div>

<script>
    const phoneInput = document.getElementById('phoneInput');
    const suggestionsBox = document.getElementById('suggestions');

    // Online Simulation: User type korle dynamic list show korbe
    phoneInput.addEventListener('input', async (e) => {
        const query = e.target.value;
        if (query.length < 1) {
            suggestionsBox.style.display = 'none';
            return;
        }

        // Simulating an Online Search Logic
        // Real-time suggest korar jonno amra popular brand names use korchi
        const commonModels = ["iPhone 11", "iPhone 12", "iPhone 13", "iPhone 14", "iPhone 15 Pro", "Samsung S23", "Samsung A54", "Redmi Note 12", "Poco X5", "Realme GT", "Vivo V29", "Oppo Reno 10"];
        
        const filtered = commonModels.filter(m => m.toLowerCase().includes(query.toLowerCase()));
        
        // Jodi amader list-e na thake, tobe Google style search simulate hobe
        let displayList = filtered.length > 0 ? filtered : [query];

        suggestionsBox.innerHTML = '';
        suggestionsBox.style.display = 'block';

        displayList.forEach(model => {
            const div = document.createElement('div');
            div.innerText = model;
            div.onclick = () => {
                phoneInput.value = model;
                suggestionsBox.style.display = 'none';
                generateSensi(model);
            };
            suggestionsBox.appendChild(div);
        });
    });

    function generateSensi(model) {
        const resDiv = document.getElementById('result');
        resDiv.style.display = 'block';

        let hash = 0;
        for (let i = 0; i < model.length; i++) {
            hash = model.charCodeAt(i) + ((hash << 5) - hash);
        }

        const isIphone = model.toLowerCase().includes("iphone");

        const getVal = (seed, min, max) => {
            const val = Math.abs(Math.sin(hash + seed) * (max - min) + min);
            return Math.floor(val);
        };

        const settings = [
            { name: "General", val: isIphone ? getVal(10, 100, 140) : getVal(10, 180, 200) },
            { name: "Red Dot", val: getVal(20, 170, 195) },
            { name: "2x Scope", val: getVal(30, 160, 190) },
            { name: "4x Scope", val: getVal(40, 150, 185) },
            { name: "Sniper Scope", val: getVal(50, 70, 120) },
            { name: "Free Camera Button", val: getVal(60, 100, 180) }
        ];

        resDiv.innerHTML = '';
        settings.forEach((s, i) => {
            const row = document.createElement('div');
            row.className = `row ${i === 0 ? 'active-row' : ''}`;
            const progress = (s.val / 200) * 100;
            row.innerHTML = `
                <div class="label">${s.name}</div>
                <div class="val">${s.val}</div>
                <div class="slider">
                    <div class="sq">-</div>
                    <div class="bar">
                        <div class="fill" style="width: ${progress}%"></div>
                        <div class="dot" style="left: ${progress}%"></div>
                    </div>
                    <div class="sq">+</div>
                </div>
            `;
            resDiv.appendChild(row);
        });
    }

    // Close suggestions on click outside
    document.addEventListener('click', (e) => {
        if (e.target !== phoneInput) suggestionsBox.style.display = 'none';
    });
</script>

</body>
</html>
