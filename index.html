<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* ব্যাকগ্রাউন্ডে একটি প্রিমিয়াম ডার্ক গ্রেডিয়েন্ট */
            background: radial-gradient(circle, #1a2a6c, #b21f1f, #fdbb2d);
            background-size: cover;
            padding: 20px;
        }

        /* মেইন কার্ড */
        .profile-card {
            width: 100%;
            max-width: 380px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            padding: 40px 25px;
            text-align: center;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
        }

        /* প্রোফাইল ইমেজ */
        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 3px solid #fff;
            margin-bottom: 15px;
            object-fit: cover;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        h1 {
            color: #fff;
            font-size: 22px;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .subtitle {
            color: rgba(255, 255, 255, 0.8);
            font-size: 13px;
            margin-bottom: 30px;
            text-transform: uppercase;
            letter-spacing: 2px;
        }

        /* বাটন সিরিয়াল কন্টেইনার */
        .button-group {
            display: flex;
            flex-direction: column; /* সিরিয়াল ভাবে সাজানোর জন্য */
            gap: 15px; /* বাটনের মাঝখানের ফাঁকা জায়গা */
        }

        /* কমন বাটন স্টাইল */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 14px;
            border-radius: 12px;
            text-decoration: none;
            color: #fff;
            font-weight: 500;
            font-size: 15px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            transition: all 0.4s ease;
        }

        .btn i {
            margin-right: 12px; /* আইকন এবং লেখার দূরত্ব */
            font-size: 18px;
        }

        /* হোভার ইফেক্টস */
        .btn:hover {
            transform: translateY(-3px);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 8px 20px rgba(0,0,0,0.2);
        }

        /* আলাদা রঙের টাচ */
        .whatsapp:hover { border-color: #25D366; color: #25D366; }
        .telegram:hover { border-color: #0088cc; color: #0088cc; }
        .facebook:hover { border-color: #1877F2; color: #1877F2; }

    </style>
</head>
<body>

    <div class="profile-card">
        <img src="profile.jpg" alt="Profile Picture" class="profile-img">
        
        <h1>আপনার নাম</h1>
        <p class="subtitle">Connect With Me</p>

        <div class="button-group">
            <a href="https://wa.me/yournumber" class="btn whatsapp" target="_blank">
                <i class="fab fa-whatsapp"></i> WhatsApp
            </a>

            <a href="https://t.me/yourusername" class="btn telegram" target="_blank">
                <i class="fab fa-telegram-plane"></i> Telegram
            </a>

            <a href="https://facebook.com/yourprofile" class="btn facebook" target="_blank">
                <i class="fab fa-facebook-f"></i> Facebook
            </a>
        </div>
    </div>

</body>
</html>
