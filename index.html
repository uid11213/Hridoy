<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Lock Screen Clone</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body, html {
            height: 100%;
            overflow: hidden;
        }

        /* Wallpaper Section */
        .lock-screen {
            background: url('https://images.unsplash.com/photo-1614850523296-d8c1af93d400?q=80&w=2070&auto=format&fit=crop') no-repeat center center/cover;
            height: 100vh;
            width: 100vw;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: space-between;
            padding: 60px 20px;
            color: white;
            position: relative;
        }

        /* Clock Style */
        .time-container {
            text-align: center;
        }

        #clock {
            font-size: 80px;
            font-weight: 600;
            letter-spacing: -2px;
        }

        #date {
            font-size: 18px;
            font-weight: 500;
            margin-top: -5px;
        }

        /* Bottom Buttons */
        .bottom-controls {
            width: 100%;
            display: flex;
            justify-content: space-between;
            padding: 0 30px 40px 30px;
            position: absolute;
            bottom: 0;
        }

        .icon-btn {
            width: 50px;
            height: 50px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px);
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            cursor: pointer;
            text-decoration: none;
            color: white;
            transition: transform 0.2s;
        }

        .icon-btn:active {
            transform: scale(0.9);
            background: rgba(255, 255, 255, 0.4);
        }

        /* Notification Bar / Home Indicator */
        .home-indicator {
            width: 120px;
            height: 5px;
            background: white;
            border-radius: 10px;
            position: absolute;
            bottom: 10px;
            left: 50%;
            transform: translateX(-50%);
        }
    </style>
</head>
<body>

    <div class="lock-screen">
        <div class="time-container">
            <div id="date"></div>
            <div id="clock">00:00</div>
        </div>

        <div class="bottom-controls">
            <a href="https://facebook.com" class="icon-btn">
                <i class="fab fa-facebook-f"></i>
            </a>

            <a href="https://wa.me/yournumber" class="icon-btn">
                <i class="fab fa-whatsapp"></i>
            </a>
        </div>

        <div class="home-indicator"></div>
    </div>

    <script>
        function updateTime() {
            const now = new Date();
            
            // Time Format
            let hours = now.getHours();
            let minutes = now.getMinutes();
            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            document.getElementById('clock').textContent = `${hours}:${minutes}`;

            // Date Format
            const options = { weekday: 'long', month: 'long', day: 'numeric' };
            document.getElementById('date').textContent = now.toLocaleDateString('en-US', options);
        }

        // Update time every second
        setInterval(updateTime, 1000);
        updateTime(); // Initial call
    </script>
</body>
</html>
