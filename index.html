<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devoryn Login Page</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* ব্যাকগ্রাউন্ড ইমেজ (ইমেজটি আপনার ফোল্ডারে থাকলে পাথ বদলে নিন) */
            background: url('https://images.unsplash.com/photo-1497215728101-856f4ea42174?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80') no-repeat center center/cover;
            overflow: hidden;
        }

        /* মেইন গ্লাস কন্টেইনার */
        .glass-container {
            position: relative;
            width: 450px;
            padding: 40px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(15px) saturate(180%);
            -webkit-backdrop-filter: blur(15px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 20px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.37);
            text-align: center;
            color: #fff;
            z-index: 1;
        }

        /* ওয়াটার ড্রপলেটস ইফেক্ট (Pseudo elements) */
        .glass-container::before {
            content: '';
            position: absolute;
            top: 10%; left: 5%;
            width: 15px; height: 15px;
            background: rgba(255, 255, 255, 0.2);
            border-radius: 50%;
            filter: blur(2px);
            box-shadow: inset 2px 2px 5px rgba(0,0,0,0.2);
        }

        .logo {
            font-size: 24px;
            font-weight: bold;
            letter-spacing: 5px;
            margin-bottom: 30px;
            text-transform: uppercase;
        }

        h2 {
            font-size: 22px;
            margin-bottom: 5px;
            font-weight: 500;
        }

        p.subtitle {
            font-size: 12px;
            margin-bottom: 30px;
            opacity: 0.8;
        }

        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .input-group input {
            width: 100%;
            padding: 12px 15px;
            background: rgba(255, 255, 255, 0.05);
            border: 1.5px solid rgba(255, 255, 255, 0.3);
            border-radius: 10px;
            outline: none;
            color: #fff;
            font-size: 14px;
            transition: 0.3s;
        }

        .input-group input:focus {
            border-color: #00d2ff;
            background: rgba(255, 255, 255, 0.1);
        }

        .input-group input::placeholder {
            color: rgba(255, 255, 255, 0.6);
        }

        .login-btn {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            background: linear-gradient(90deg, rgba(0,210,255,0.3), rgba(58,123,213,0.3));
            border: 1px solid rgba(255, 255, 255, 0.4);
            border-radius: 10px;
            color: #fff;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: 0.3s;
        }

        .login-btn:hover {
            background: rgba(0, 210, 255, 0.5);
            transform: translateY(-2px);
        }

        .links {
            margin-top: 20px;
            font-size: 13px;
        }

        .links a {
            color: #fff;
            text-decoration: none;
            opacity: 0.7;
            transition: 0.3s;
        }

        .links a:hover {
            opacity: 1;
            text-decoration: underline;
        }

        .signup-text {
            margin-top: 10px;
            display: block;
        }
    </style>
</head>
<body>

    <div class="glass-container">
        <div class="logo">:::DEVORYN</div>
        
        <h2>Please Log In</h2>
        <p class="subtitle">to your Devoryn Workspace</p>

        <form action="#">
            <div class="input-group">
                <input type="text" placeholder="Email or Username" required>
            </div>
            
            <div class="input-group">
                <input type="password" placeholder="Password" required>
            </div>

            <button type="submit" class="login-btn">Sign In</button>
        </form>

        <div class="links">
            <a href="#">Forgot Password?</a>
            <span class="signup-text">Don't have an account? <a href="#">Sign up</a></span>
        </div>
    </div>

</body>
</html>
