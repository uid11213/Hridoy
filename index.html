<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Personal Profile Page</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            /* প্রিমিয়াম ডার্ক ব্যাকগ্রাউন্ড */
            background: #0f172a; 
            overflow: hidden;
        }

        /* মেইন কার্ড কন্টেইনার */
        .profile-container {
            text-align: center;
            color: #fff;
            background: rgba(255, 255, 255, 0.03);
            padding: 50px 40px;
            border-radius: 40px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
        }

        /* প্রোফাইল ইমেজ */
        .user-image {
            width: 130px;
            height: 130px;
            border-radius: 35px; /* হালকা স্কয়ার-রাউন্ড অ্যাপ স্টাইল */
            object-fit: cover;
            margin-bottom: 20px;
            border: 2px solid rgba(255, 255, 255, 0.2);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        h1 {
            font-size: 26px;
            margin-bottom: 5px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .tagline {
            font-size: 14px;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 30px;
        }

        /* অ্যাপ আইকন বাটন গ্রুপ (ডান থেকে বামে সাজানো) */
        .app-icons-group {
            display: flex;
            flex-direction: row-reverse; /* ডান থেকে বামে সিরিয়াল করার জন্য */
            justify-content: center;
            gap: 20px;
        }

        /* প্রতিটি অ্যাপ আইকন বাটন */
        .app-btn {
            width: 60px;
            height: 60px;
            background: rgba(255, 255, 255, 0.07);
            border-radius: 18px; /* App Icon Style */
            display: flex;
            justify-content: center;
            align-items: center;
            text-decoration: none;
            color: #fff;
            font-size: 24px;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 8px 15px rgba(0,0,0,0.2);
        }

        /* হোভার করলে আইকন বড় হবে এবং কালার আসবে */
        .app-btn:hover {
            transform: scale(1.15) translateY(-5px);
            background: rgba(255, 255, 255, 0.15);
        }

        .facebook:hover { color: #1877F2; border-color: #1877F2; }
        .telegram:hover { color: #0088cc; border-color: #0088cc; }
        .whatsapp:hover { color: #25D366; border-color: #25D366; }

    </style>
</head>
<body>

    <div class="profile-container">
        <img src="profile.jpg" alt="Profile" class="user-image">
        
        <h1>আপনার নাম</h1>
        <p class="tagline">Web Developer & Designer</p>

        <div class="app-icons-group">
            <a href="https://facebook.com/your-id" class="app-btn facebook" title="Facebook">
                <i class="fab fa-facebook-f"></i>
            </a>

            <a href="https://t.me/your-username" class="app-btn telegram" title="Telegram">
                <i class="fab fa-telegram-plane"></i>
            </a>

            <a href="https://wa.me/your-number" class="app-btn whatsapp" title="WhatsApp">
                <i class="fab fa-whatsapp"></i>
            </a>
        </div>
    </div>

</body>
</html>
