<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Liquid Glass UI</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background: #f4f7f6;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-image: radial-gradient(circle at 20% 30%, #e0e7ff 0%, transparent 40%),
                              radial-gradient(circle at 80% 70%, #ffebf0 0%, transparent 40%);
        }

        /* --- Navbar Container --- */
        .nav-container {
            position: relative;
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 10px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.7);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.05);
            z-index: 10;
        }

        /* --- Liquid Moving Background --- */
        .nav-indicator {
            position: absolute;
            height: calc(100% - 20px);
            width: 110px; /* Default width for Home */
            background: #ffffff;
            border-radius: 40px;
            box-shadow: 0 8px 20px rgba(0, 0, 0, 0.06);
            transition: all 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55); /* Liquid Motion Physics */
            z-index: -1;
            left: 10px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 12px 20px;
            cursor: pointer;
            color: #666;
            transition: 0.3s;
            user-select: none;
            min-width: 65px;
            position: relative;
        }

        .nav-item i {
            font-size: 26px;
            transition: 0.3s;
        }

        .nav-item span {
            font-size: 16px;
            font-weight: 600;
            margin-left: 8px;
            max-width: 0;
            opacity: 0;
            overflow: hidden;
            transition: all 0.4s ease;
            white-space: nowrap;
        }

        /* --- Active States --- */
        .nav-item.active {
            color: #000;
        }

        .nav-item.active span {
            max-width: 100px;
            opacity: 1;
        }

        /* Hover effect slightly expands the item */
        .nav-item:hover:not(.active) {
            color: #111;
        }

    </style>
</head>
<body>

    <nav class="nav-container">
        <div class="nav-indicator" id="indicator"></div>

        <div class="nav-item active" onclick="moveIndicator(this, 0)">
            <i class='bx bx-home-alt-2'></i>
            <span>Home</span>
        </div>
        <div class="nav-item" onclick="moveIndicator(this, 1)">
            <i class='bx bx-list-check'></i>
            <span>Tasks</span>
        </div>
        <div class="nav-item" onclick="moveIndicator(this, 2)">
            <i class='bx bx-folder'></i>
            <span>Files</span>
        </div>
        <div class="nav-item" onclick="moveIndicator(this, 3)">
            <i class='bx bx-message-square-detail'></i>
            <span>Chat</span>
        </div>
    </nav>

    <script>
        function moveIndicator(element, index) {
            const indicator = document.getElementById('indicator');
            const items = document.querySelectorAll('.nav-item');
            
            // Remove active class from all
            items.forEach(item => item.classList.remove('active'));
            
            // Add active class to clicked one
            element.classList.add('active');

            // Calculate Position & Width for Liquid Effect
            const rect = element.getBoundingClientRect();
            const parentRect = element.parentElement.getBoundingClientRect();
            
            // Apply new width and position
            indicator.style.width = element.offsetWidth + 'px';
            indicator.style.left = (element.offsetLeft) + 'px';
        }

        // Initialize position on load
        window.onload = () => {
            const activeItem = document.querySelector('.nav-item.active');
            const indicator = document.getElementById('indicator');
            indicator.style.width = activeItem.offsetWidth + 'px';
            indicator.style.left = activeItem.offsetLeft + 'px';
        };
    </script>

</body>
</html>
