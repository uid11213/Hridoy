<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>60FPS Smooth UI</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: #0f1113; /* Deep Dark */
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .nav-bar {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 8px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            gap: 4px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
        }

        .nav-item {
            position: relative;
            display: flex;
            align-items: center;
            padding: 12px 20px;
            border-radius: 100px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.5);
            transition: color 0.3s ease;
            will-change: transform; /* Browser ke prepare rakhe fast action er jonno */
        }

        /* Active Item er pichone shada layer */
        .nav-item::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #ffffff;
            border-radius: 100px;
            z-index: -1;
            opacity: 0;
            transform: scale(0.8); /* Choto theke boro hobe transition e */
            transition: transform 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), opacity 0.2s ease;
        }

        .nav-item i {
            font-size: 24px;
            transition: transform 0.3s ease;
        }

        .nav-item span {
            font-size: 15px;
            font-weight: 700;
            margin-left: 0;
            width: 0;
            overflow: hidden;
            display: inline-block;
            transition: width 0.3s cubic-bezier(0.34, 1.56, 0.64, 1), margin 0.3s ease, opacity 0.2s ease;
            opacity: 0;
            white-space: nowrap;
        }

        /* --- Active State Logic --- */
        .nav-item.active {
            color: #000;
        }

        .nav-item.active::before {
            opacity: 1;
            transform: scale(1); /* Smoothly scale up hobe */
        }

        .nav-item.active span {
            width: 55px; /* Text er width fixed kore dilam lag free rakhar jonno */
            margin-left: 10px;
            opacity: 1;
        }

        .nav-item.active i {
            transform: scale(0.9); /* Halka icon scale down for depth */
        }

        /* Hover Feedback */
        .nav-item:hover:not(.active) {
            color: #fff;
        }
    </style>
</head>
<body>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="switchTab(this)">
            <i class='bx bx-home-alt-2'></i>
            <span>Home</span>
        </div>

        <div class="nav-item" onclick="switchTab(this)">
            <i class='bx bx-grid-alt'></i>
            <span>Apps</span>
        </div>

        <div class="nav-item" onclick="switchTab(this)">
            <i class='bx bx-folder'></i>
            <span>Files</span>
        </div>

        <div class="nav-item" onclick="switchTab(this)">
            <i class='bx bx-message-square-dots'></i>
            <span>Chat</span>
        </div>
    </nav>

    <script>
        function switchTab(el) {
            // Instant class toggle
            const currentActive = document.querySelector('.nav-item.active');
            if (currentActive === el) return;

            currentActive.classList.remove('active');
            el.classList.add('active');
        }
    </script>

</body>
</html>
