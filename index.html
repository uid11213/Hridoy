<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Pro Sensi Finder | 200 Max</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #e0e0e0;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 550px;
            background: #151515;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #222;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #ffae00;
            margin-bottom: 20px;
        }

        .search-container {
            position: relative;
            margin-bottom: 25px;
        }

        input {
            width: 100%;
            padding: 15px;
            background: #222;
            border: 1px solid #444;
            color: white;
            border-radius: 5px;
            outline: none;
            box-sizing: border-box;
            font-size: 16px;
        }

        input:focus { border-color: #ffae00; }

        .suggestions {
            position: absolute;
            top: 100%;
            left: 0;
            right: 0;
            background: #1e1e1e;
            border: 1px solid #333;
            max-height: 150px;
            overflow-y: auto;
            z-index: 10;
            display: none;
            border-radius: 0 0 8px 8px;
        }

        .suggestions div {
            padding: 10px;
            cursor: pointer;
            border-bottom: 1px solid #222;
        }

        .suggestions div:hover { background: #ffae00; color: #000; }

        /* Sensi UI Layout */
        .sensi-box {
            border: 1px solid #222;
            background: #111;
        }

        .row {
            display: flex;
            align-items: center;
            padding: 12px 15px;
            border-bottom: 1px solid #222;
        }

        .active-row {
            outline: 1.5px solid #ffae00;
            background: rgba(255, 174, 0, 0.05);
        }

        .label { flex: 2; font-size: 14px; }
        .val { flex: 0.5; text-align: right; padding-right: 15px; font-weight: bold; color: #fff; font-size: 18px; }

        .slider {
            flex: 3;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .sq { width: 22px; height: 22px; background: #2a2a2a; display: flex; justify-content: center; align-items: center; border: 1px solid #444; }
        .bar { flex-grow: 1; height: 4px; background: #333; position: relative; }
        .fill { height: 100%; background: #ffae00; position: absolute; }
        .dot { width: 8px; height: 16px; background: #fff; position: absolute; top: -6px; border: 1px solid #000; }
    </style>
</head>
<body>

<div class="container">
    <div class="header">
        <h2 style="color: #ffae00; letter-spacing: 2px; margin-bottom: 10px;">SENSITIVITY</h2>
    </div>

    <div class="search-container">
        <input type="text" id="phoneInput" placeholder="Search phone (e.g. iPhone X, Redmi Note 12)" onkeyup="searchModel()">
        <div id="suggestions" class="suggestions"></div>
    </div>

    <div id="result" class="sensi-box" style="display: none;">
        </div>
</div>

<script>
    // List of some popular models for live search
    const models = [
        "iPhone X", "iPhone 11", "iPhone 12", "iPhone 13 Pro", "iPhone 14 Pro Max", "iPhone 15",
        "Samsung S22 Ultra", "Samsung A54", "Samsung M32", "Samsung S23",
        "Redmi Note 10", "Redmi Note 12", "Poco X3 Pro", "Poco F5", "Xiaomi 13T",
        "Realme GT Neo 3", "Realme 9 Pro", "Realme C55", "Realme 11 Pro+",
        "Vivo V27", "Vivo Y20", "Oppo Reno 8", "OnePlus 11", "Infinix Note 30"
    ];

    function searchModel() {
        const input = document.getElementById('phoneInput').value.toLowerCase();
        const suggBox = document.getElementById('suggestions');
        suggBox.innerHTML = '';

        if (input.length > 0) {
            const filtered = models.filter(m => m.toLowerCase().includes(input));
            if (filtered.length > 0) {
                suggBox.style.display = 'block';
                filtered.forEach(m => {
                    const d = document.createElement('div');
                    d.innerHTML = m;
                    d.onclick = () => {
                        document.getElementById('phoneInput').value = m;
                        suggBox.style.display = 'none';
                        showSensi(m);
                    };
                    suggBox.appendChild(d);
                });
            } else {
                // Jodi list-e na thake tobuo type korle result dekhabe
                suggBox.style.display = 'none';
                showSensi(input);
            }
        } else {
            suggBox.style.display = 'none';
            document.getElementById('result').style.display = 'none';
        }
    }

    function showSensi(model) {
        const resDiv = document.getElementById('result');
        resDiv.style.display = 'block';

        let hash = 0;
        for (let i = 0; i < model.length; i++) {
            hash = model.charCodeAt(i) + ((hash << 5) - hash);
        }

        const isIphone = model.toLowerCase().includes("iphone") || model.toLowerCase().includes("apple");

        const getVal = (seed, min, max) => {
            const val = Math.abs(Math.sin(hash + seed) * (max - min) + min);
            return Math.floor(val);
        };

        // Settings updated for 1-200 scale
        const settings = [
            { name: "General", val: isIphone ? getVal(1, 100, 150) : getVal(1, 185, 200) },
            { name: "Red Dot", val: getVal(2, 170, 195) },
            { name: "2x Scope", val: getVal(3, 160, 190) },
            { name: "4x Scope", val: getVal(4, 150, 185) },
            { name: "Sniper Scope", val: getVal(5, 80, 130) },
            { name: "Free Camera Button", val: getVal(6, 100, 180) }
        ];

        resDiv.innerHTML = '';
        settings.forEach((s, i) => {
            const row = document.createElement('div');
            row.className = `row ${i === 0 ? 'active-row' : ''}`;
            // Progress percentage for 200 scale is (val/200)*100
            const progress = (s.val / 200) * 100;
            row.innerHTML = `
                <div class="label">${s.name}</div>
                <div class="val">${s.val}</div>
                <div class="slider">
                    <div class="sq">-</div>
                    <div class="bar">
                        <div class="fill" style="width: ${progress}%"></div>
                        <div class="dot" style="left: ${progress}%"></div>
                    </div>
                    <div class="sq">+</div>
                </div>
            `;
            resDiv.appendChild(row);
        });
    }
</script>

</body>
</html>
