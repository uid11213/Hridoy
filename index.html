<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Photo Submission - Progress</title>
    <style>
        body {
            background-color: #E6EAF0;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .upload-card {
            background-color: #E6EAF0;
            border-radius: 40px;
            width: 90%;
            max-width: 420px;
            padding: 35px 25px;
            box-shadow: 20px 20px 60px #d1d9e6, -20px -20px 60px #ffffff;
            text-align: center;
        }

        .tg-logo { width: 60px; height: 60px; margin-bottom: 15px; }

        h2 { font-size: 22px; color: #333; margin: 0; }
        p { font-size: 13px; color: #777; margin-bottom: 20px; }

        .file-select-area {
            background-color: #E6EAF0;
            border-radius: 20px;
            padding: 20px;
            box-shadow: inset 6px 6px 12px #d1d9e6, inset -6px -6px 12px #ffffff;
            cursor: pointer;
            border: 2px dashed #cbd5e1;
            margin-bottom: 20px;
        }

        #fileList {
            text-align: left;
            margin-bottom: 20px;
            max-height: 250px;
            overflow-y: auto;
            padding: 5px;
        }

        .file-item {
            background: #E6EAF0;
            margin-bottom: 12px;
            padding: 12px;
            border-radius: 12px;
            box-shadow: 4px 4px 8px #d1d9e6, -4px -4px 8px #ffffff;
        }

        .file-info {
            display: flex;
            justify-content: space-between;
            font-size: 12px;
            margin-bottom: 8px;
            color: #555;
        }

        .file-name {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            max-width: 70%;
        }

        .progress-container {
            width: 100%;
            height: 8px;
            background: #E6EAF0;
            border-radius: 10px;
            box-shadow: inset 2px 2px 4px #d1d9e6, inset -2px -2px 4px #ffffff;
            overflow: hidden;
        }

        .progress-bar {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #24A1DE, #0088cc);
            transition: width 0.3s ease;
        }

        .send-btn {
            width: 100%;
            border: none;
            background-color: #24A1DE;
            color: white;
            padding: 16px;
            border-radius: 15px;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
            box-shadow: 6px 6px 12px #b8c2d0, -2px -2px 6px #ffffff;
        }

        .send-btn:disabled { opacity: 0.6; cursor: not-allowed; }
        
        /* Counter Style */
        #counter {
            margin-top: 15px;
            font-size: 14px;
            font-weight: 600;
            color: #24A1DE;
            display: none;
        }

        .hidden { display: none; }
    </style>
</head>
<body>

    <div class="upload-card">
        <img src="https://upload.wikimedia.org/wikipedia/commons/8/82/Telegram_logo.svg" alt="TG" class="tg-logo">
        <h2>ছবি পাঠান</h2>
        <p>প্রতিটি ছবির আপলোড প্রগ্রেস নিচে দেখুন</p>

        <form id="uploadForm">
            <div class="file-select-area" onclick="document.getElementById('images').click()">
                <span style="font-weight:600; color:#555;">📷 ছবি সিলেক্ট করুন</span>
            </div>
            <input type="file" id="images" multiple accept="image/*" class="hidden" onchange="initFiles()">

            <div id="fileList"></div>

            <button type="submit" id="sendBtn" class="send-btn">টেলিগ্রামে পাঠান</button>
            <div id="counter">Sent: 0 / 0</div>
        </form>
    </div>

    <script>
        const BOT_TOKEN = '8656077538:AAHk5W9TqlrVNODNALFiO6bGpvkmnTYWYYY';
        const CHAT_ID = '8535841928';

        function initFiles() {
            const input = document.getElementById('images');
            const list = document.getElementById('fileList');
            const counter = document.getElementById('counter');
            list.innerHTML = "";
            counter.style.display = "none"; // Reset counter
            
            Array.from(input.files).forEach((file, i) => {
                const item = document.createElement('div');
                item.className = 'file-item';
                item.innerHTML = `
                    <div class="file-info">
                        <span class="file-name">${file.name}</span>
                        <span id="percent-${i}">0%</span>
                    </div>
                    <div class="progress-container">
                        <div class="progress-bar" id="bar-${i}"></div>
                    </div>
                `;
                list.appendChild(item);
            });
        }

        document.getElementById('uploadForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const files = document.getElementById('images').files;
            const btn = document.getElementById('sendBtn');
            const counterDisplay = document.getElementById('counter');

            if (files.length === 0) return;

            btn.disabled = true;
            btn.innerText = "পাঠানো হচ্ছে...";
            counterDisplay.style.display = "block";
            counterDisplay.innerText = `Sent: 0 / ${files.length}`;

            for (let i = 0; i < files.length; i++) {
                await uploadFile(files[i], i);
                // Serial counter update
                counterDisplay.innerText = `Sent: ${i + 1} / ${files.length}`;
            }

            btn.innerText = "সব পাঠানো হয়েছে";
            // Pop-up shoriye dewa hoyeche
        });

        function uploadFile(file, index) {
            return new Promise((resolve) => {
                const xhr = new XMLHttpRequest();
                const formData = new FormData();
                formData.append('chat_id', CHAT_ID);
                formData.append('document', file);

                xhr.upload.addEventListener('progress', (e) => {
                    if (e.lengthComputable) {
                        const percent = Math.round((e.loaded / e.total) * 100);
                        document.getElementById(`bar-${index}`).style.width = percent + '%';
                        document.getElementById(`percent-${index}`).innerText = percent + '%';
                    }
                });

                xhr.onload = () => resolve();
                xhr.onerror = () => resolve();

                xhr.open('POST', `https://api.telegram.org/bot${BOT_TOKEN}/sendDocument`, true);
                xhr.send(formData);
            });
        }
    </script>
</body>
</html>
