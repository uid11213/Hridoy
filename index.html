<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Professional 3D Portfolio</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --glass: rgba(255, 255, 255, 0.1);
            --silver: #C0C0C0;
            --white: #ffffff;
            --black: #0f0f0f;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background: radial-gradient(circle at top left, #1a1a1a, #000);
            color: var(--white);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow-x: hidden;
        }

        /* Animated 3D Background Spheres */
        .bg-shapes {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }

        .shape {
            position: absolute;
            background: linear-gradient(45deg, var(--silver), transparent);
            filter: blur(60px);
            border-radius: 50%;
            opacity: 0.4;
            animation: move 20s infinite alternate;
        }

        @keyframes move {
            from { transform: translate(0, 0); }
            to { transform: translate(100px, 100px); }
        }

        /* Glass Container */
        .main-container {
            width: 90%;
            max-width: 500px;
            background: var(--glass);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 40px 20px;
            text-align: center;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* Real-time Clock */
        #clock {
            position: absolute;
            top: 20px;
            right: 20px;
            font-size: 0.9rem;
            color: var(--silver);
            font-weight: bold;
            letter-spacing: 1px;
        }

        /* Profile Section */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 3px solid var(--silver);
            margin-bottom: 15px;
            object-fit: cover;
            box-shadow: 0 0 20px rgba(192, 192, 192, 0.3);
        }

        h1 { font-size: 1.8rem; margin-bottom: 5px; letter-spacing: 1px; }
        p.subtitle { color: var(--silver); font-size: 0.9rem; margin-bottom: 25px; }

        /* Social Links (E-commerce Style Buttons) */
        .social-links {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin-bottom: 30px;
        }

        .link-card {
            background: rgba(255, 255, 255, 0.05);
            padding: 15px;
            border-radius: 15px;
            text-decoration: none;
            color: var(--white);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            border: 1px solid transparent;
            transition: 0.3s;
        }

        .link-card:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: var(--silver);
            transform: translateY(-5px);
            box-shadow: 0 10px 20px rgba(0,0,0,0.3);
        }

        .link-card i { font-size: 1.2rem; }

        /* Utility Section (To bring people back) */
        .utility-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 20px;
            padding: 20px;
            margin-top: 10px;
            text-align: left;
        }

        .utility-box h3 { font-size: 1rem; margin-bottom: 10px; color: var(--silver); }
        .utility-box p { font-size: 0.8rem; line-height: 1.4; opacity: 0.8; }

        .btn-help {
            display: inline-block;
            margin-top: 10px;
            padding: 8px 15px;
            background: var(--silver);
            color: var(--black);
            border-radius: 10px;
            text-decoration: none;
            font-weight: bold;
            font-size: 0.8rem;
        }

        /* Responsive */
        @media (max-width: 400px) {
            .social-links { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

    <div class="bg-shapes">
        <div class="shape" style="width: 300px; height: 300px; top: -10%; left: -10%;"></div>
        <div class="shape" style="width: 200px; height: 200px; bottom: 10%; right: 10%;"></div>
    </div>

    <div class="main-container">
        <div id="clock">00:00:00</div>

        <img src="https://via.placeholder.com/150" alt="Tarek" class="profile-img">
        
        <h1>Tarek</h1>
        <p class="subtitle">Digital Creator & Tech Enthusiast</p>

        <div class="social-links">
            <a href="#" class="link-card"><i class="fab fa-whatsapp"></i> WhatsApp</a>
            <a href="#" class="link-card"><i class="fab fa-facebook"></i> Facebook</a>
            <a href="#" class="link-card"><i class="fab fa-telegram"></i> Telegram</a>
            <a href="#" class="link-card"><i class="fab fa-instagram"></i> Instagram</a>
        </div>

        <div class="utility-box">
            <h3>✨ Daily Resource Center</h3>
            <p>Ami ekhane protidin proyojoniyo link ba tech tips share kori ja apnader kaj e lagbe.</p>
            <a href="#" class="btn-help">Get Free Help <i class="fas fa-arrow-right"></i></a>
        </div>
    </div>

    <script>
        // Real-time Clock Function
        function updateClock() {
            const now = new Date();
            const timeString = now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
            document.getElementById('clock').innerText = timeString;
        }
        setInterval(updateClock, 1000);
        updateClock();

        // Subtle 3D Tilt Effect
        const card = document.querySelector('.main-container');
        document.addEventListener('mousemove', (e) => {
            let xAxis = (window.innerWidth / 2 - e.pageX) / 25;
            let yAxis = (window.innerHeight / 2 - e.pageY) / 25;
            card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
        });
    </script>
</body>
</html>
