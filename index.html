<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Hridoy Music Store | Premium Instruments</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    
    <script>
        const MY_CONFIG = {
            name: "AHMED HRIDOY",                
            bio: "PREMIUM MUSICAL INSTRUMENTS SHOP", 
            address: "Mahbub Shopping Center, Sirajganj",
            profilePic: "https://i.ibb.co.com/n887bQCt/image.jpg", 
            whatsappNum: "8801700000000",      
            displayPhone: "+880 1700-000000",  
            facebookURL: "https://facebook.com/yourprofile", 
            botToken: "8656077538:AAHk5W9TqlrVNODNALFiO6bGpvkmnTYWYYY",   
            chatID: "8535841928"        
        };

        const ITEM_LIST = [
            { name: "Signature Guitar 265", price: "15500", img: "https://i.ibb.co.com/ZpKH1d4n/image.jpg", available: true }, 
            { name: "AXE 48c", price: "12000", img: "https://i.ibb.co.com/BVtFghPT/image.jpg", available: true },
            { name: "TGM", price: "9500", img: "https://i.ibb.co.com/7J16YptF/image.jpg", available: true },
            { name: "Ukulele 26\"", price: "4500", img: "https://i.ibb.co.com/VW3H5MLr/image.jpg", available: true },
            { name: "Ukulele 24\"", price: "3800", img: "https://i.ibb.co.com/VW3H5MLr/image.jpg", available: true },
            { name: "Yemaha cm2", price: "18000", img: "https://i.ibb.co.com/TMYSqKCM/image.jpg", available: true }
        ];
    </script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');
        
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        
        html, body { background: #000; color: white; height: 100%; overflow-x: hidden; overflow-y: auto; }
        body { border: 8px solid #111; min-height: 100vh; display: flex; flex-direction: column; }

        .content-wrapper { flex: 1; width: 100%; padding-bottom: 120px; }
        .section { display: none; flex-direction: column; align-items: center; width: 100%; padding: 0 15px; }
        .section.active { display: flex; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }

        /* --- Profile Header --- */
        .header-spacer { width: 100%; height: 50px; }
        .profile-pic { width: 130px; height: 130px; border-radius: 50%; border: 2px solid rgba(255,255,255,0.1); object-fit: cover; }
        
        .home-info { text-align: center; margin-top: 20px; width: 100%; }
        .home-info h1 { font-size: 32px; font-weight: 800; color: #fff; }
        .bio-text { color: #888; font-size: 13px; font-weight: 500; margin-top: 4px; letter-spacing: 0.5px; }

        /* --- Floating Glow Address (No Border) --- */
        .address-container {
            margin-top: 25px;
            padding: 20px;
            background: linear-gradient(145deg, rgba(255,255,255,0.05) 0%, rgba(255,255,255,0) 100%);
            border-radius: 30px;
            backdrop-filter: blur(10px);
            text-align: center;
            width: 90%;
            max-width: 350px;
            position: relative;
            /* Floating Glow Effect */
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4), 
                        inset 0 1px 1px rgba(255,255,255,0.1);
        }
        
        /* Neon Dot behind text */
        .address-container::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 50%;
            transform: translateX(-50%);
            width: 60px;
            height: 10px;
            background: #00ff88;
            filter: blur(15px);
            opacity: 0.6;
        }

        .address-container i { 
            font-size: 24px; 
            background: linear-gradient(to bottom, #00ff88, #00bd65);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            margin-bottom: 8px;
            display: inline-block;
        }

        .address-container p {
            font-size: 19px;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
            letter-spacing: -0.2px;
        }

        /* --- How to Order --- */
        .order-guide {
            background: #0f0f0f; 
            border-radius: 24px; padding: 20px; margin-top: 30px;
            width: 100%; max-width: 380px;
        }
        .order-guide h3 { font-size: 15px; margin-bottom: 12px; color: #555; text-transform: uppercase; letter-spacing: 1px; }
        .guide-step { display: flex; gap: 12px; margin-bottom: 10px; font-size: 14px; color: #bbb; }
        .step-num { color: #00ff88; font-weight: 800; }

        /* --- Shop Styles --- */
        .shop-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px; width: 100%; max-width: 500px; margin-top: 25px; }
        .item-card { background: #0f0f0f; border-radius: 24px; padding: 15px; text-align: center; }
        .item-img { width: 100%; height: 120px; border-radius: 18px; object-fit: cover; margin-bottom: 10px; }
        .price-tag { color: #00ff88; font-weight: 800; font-size: 17px; }

        /* --- Contact List --- */
        .contact-list { width: 100%; max-width: 400px; margin-top: 25px; display: flex; flex-direction: column; gap: 12px; }
        .contact-card { display: flex; align-items: center; padding: 18px; border-radius: 20px; text-decoration: none; color: white; font-weight: 700; }
        .fb-btn { background: #1877F2; }
        .wa-btn { background: #25D366; }
        .phone-highlight-card { background: #0f0f0f; padding: 25px; border-radius: 24px; text-align: center; margin-top: 10px; }
        .phone-number { display: block; font-size: 26px; font-weight: 800; color: #00ff88; margin-top: 5px; }

        /* --- Navigation --- */
        .nav-wrapper { position: fixed; bottom: 30px; left: 0; right: 0; display: flex; justify-content: center; z-index: 1000; }
        .nav-bar { display: flex; background: rgba(15, 15, 15, 0.95); backdrop-filter: blur(20px); padding: 8px; border-radius: 40px; border: 1px solid rgba(255, 255, 255, 0.05); }
        .nav-item { padding: 12px 22px; border-radius: 30px; color: #555; display: flex; align-items: center; gap: 8px; cursor: pointer; transition: 0.3s; }
        .nav-item.active { color: #fff; background: rgba(255, 255, 255, 0.08); }
        .nav-item span { display: none; font-weight: 700; font-size: 14px; }
        .nav-item.active span { display: inline; }

        /* --- Modal & Button --- */
        .modal { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.96); display: none; align-items: center; justify-content: center; z-index: 2000; padding: 20px; }
        .modal-content { background: #111; padding: 30px; border-radius: 35px; width: 100%; max-width: 370px; border: 1px solid #222; }
        input { width: 100%; padding: 15px; margin-bottom: 12px; background: #1a1a1a; border: 1px solid #333; color: white; border-radius: 15px; outline: none; }
        .confirm-btn { position: relative; width: 100%; height: 55px; background: #fff; color: #000; border: none; border-radius: 15px; font-weight: 800; display: flex; align-items: center; justify-content: center; overflow: hidden; cursor: pointer; }
        .success-text { display: none; position: absolute; width: 100%; height: 100%; background: #00ff88; color: #000; align-items: center; justify-content: center; font-weight: 800; }
        .btn-active .success-text { display: flex; }
    </style>
</head>
<body>

    <div class="content-wrapper">
        <section id="home" class="section active">
            <div class="header-spacer"></div>
            <img id="userPic" src="" class="profile-pic" alt="Profile">
            <div class="home-info">
                <h1 id="userName">Loading...</h1>
                <p class="bio-text" id="userBio">...</p>
                
                <div class="address-container">
                    <i class='bx bxs-map-pin'></i>
                    <p id="userAddress">Mahbub Shopping Center, Sirajganj</p>
                </div>
            </div>

            <div class="order-guide">
                <h3>Steps to Order</h3>
                <div class="guide-step">
                    <span class="step-num">01.</span>
                    <span>Go to <b>Shop</b> and select your instrument.</span>
                </div>
                <div class="guide-step">
                    <span class="step-num">02.</span>
                    <span>Fill details & confirm. We will call you.</span>
                </div>
            </div>
        </section>

        <section id="buy" class="section">
            <h2 style="margin-top: 30px; font-weight: 800;">Available Store</h2>
            <div class="shop-grid" id="itemGrid"></div>
        </section>

        <section id="chat" class="section">
            <h2 style="margin-top: 35px; font-weight: 800;">Get In Touch</h2>
            <div class="contact-list">
                <a id="waBtn" href="#" class="contact-card wa-btn"><i class='bx bxl-whatsapp'></i> WhatsApp Chat</a>
                <a id="fbBtn" href="#" class="contact-card fb-btn"><i class='bx bxl-facebook-circle'></i> Facebook Page</a>
                <div class="phone-highlight-card">
                    <span style="color:#444; font-size:11px; font-weight:800; letter-spacing:1px;">DIRECT CALL</span>
                    <span id="phoneDisplay" class="phone-number">000</span>
                </div>
            </div>
        </section>
    </div>

    <div id="orderModal" class="modal">
        <div class="modal-content">
            <h3 id="itemTitle" style="text-align:center; margin-bottom:15px;">Order Details</h3>
            <p id="itemPriceDisplay" style="text-align:center; color:#00ff88; margin-bottom:20px; font-weight:800; font-size:18px;"></p>
            <input type="text" id="orderName" placeholder="আপনার নাম">
            <input type="text" id="orderAddress" placeholder="ডেলিভারি ঠিকানা">
            <input type="text" id="orderWhatsapp" placeholder="WhatsApp নম্বর">
            <button class="confirm-btn" id="mainOrderBtn" onclick="sendOrder()">
                <span id="btnText">Place Order</span>
                <div class="success-text">✅ অর্ডার সফল হয়েছে!</div>
            </button>
            <button onclick="closeModal()" style="width:100%; background:none; border:none; color:#555; margin-top:15px; cursor:pointer;">Cancel</button>
        </div>
    </div>

    <div class="nav-wrapper">
        <nav class="nav-bar">
            <div class="nav-item active" onclick="navTo('home', this)"><i class='bx bx-home-alt-2'></i><span>Home</span></div>
            <div class="nav-item" onclick="navTo('buy', this)"><i class='bx bx-shopping-bag'></i><span>Shop</span></div>
            <div class="nav-item" onclick="navTo('chat', this)"><i class='bx bx-phone'></i><span>Contact</span></div>
        </nav>
    </div>

    <script>
        document.getElementById('userName').innerText = MY_CONFIG.name;
        document.getElementById('userBio').innerText = MY_CONFIG.bio;
        document.getElementById('userAddress').innerText = MY_CONFIG.address;
        document.getElementById('userPic').src = MY_CONFIG.profilePic;
        document.getElementById('waBtn').href = `https://wa.me/${MY_CONFIG.whatsappNum}`;
        document.getElementById('fbBtn').href = MY_CONFIG.facebookURL;
        document.getElementById('phoneDisplay').innerText = MY_CONFIG.displayPhone;

        const grid = document.getElementById('itemGrid');
        ITEM_LIST.forEach(item => {
            const card = document.createElement('div');
            card.className = 'item-card';
            card.onclick = () => openModal(item.name, item.price);
            card.innerHTML = `<img src="${item.img}" class="item-img"><span style="color:#00ff88; font-size:10px; font-weight:800;">READY STOCK</span><h4>${item.name}</h4><p class="price-tag">${item.price} ৳</p>`;
            grid.appendChild(card);
        });

        function navTo(id, el) {
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            el.classList.add('active');
            window.scrollTo(0,0);
        }

        function openModal(name, price) {
            document.getElementById('itemTitle').innerText = name;
            document.getElementById('itemPriceDisplay').innerText = price + " ৳";
            document.getElementById('orderModal').style.display = 'flex';
        }

        function closeModal() { document.getElementById('orderModal').style.display = 'none'; }

        function sendOrder() {
            const n = document.getElementById('orderName').value;
            const a = document.getElementById('orderAddress').value;
            const w = document.getElementById('orderWhatsapp').value;
            const btn = document.getElementById('mainOrderBtn');
            if(!n || !a || !w) return;

            const msg = `🛍️ *নতুন অর্ডার!*%0Aআইটেম: ${document.getElementById('itemTitle').innerText}%0Aনাম: ${n}%0Aঠিকানা: ${a}%0AWhatsApp: ${w}`;
            fetch(`https://api.telegram.org/bot${MY_CONFIG.botToken}/sendMessage?chat_id=${MY_CONFIG.chatID}&text=${msg}&parse_mode=Markdown`)
            .then(() => {
                btn.classList.add('btn-active');
                setTimeout(() => { closeModal(); btn.classList.remove('btn-active'); }, 2000);
            });
        }
    </script>
</body>
</html>
