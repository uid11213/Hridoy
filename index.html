<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Premium Profile UI</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
            -webkit-font-smoothing: antialiased;
        }

        body {
            background: #050708;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border: 12px solid #1a1d21;
            position: relative;
        }

        .content-wrapper {
            flex: 1;
            position: relative;
            width: 100%;
        }

        .section {
            position: absolute;
            top: 0; left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            opacity: 0;
            visibility: hidden;
            transform: translate3d(0, 15px, 0);
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .section.active {
            opacity: 1;
            visibility: visible;
            transform: translate3d(0, 0, 0);
        }

        /* --- Facebook Style Profile Header --- */
        .profile-header {
            width: 100%;
            position: relative;
            display: flex;
            flex-direction: column;
            align-items: center;
            margin-bottom: 60px; /* Space for text below */
        }

        .cover-photo {
            width: 100%;
            height: 180px;
            background: linear-gradient(to bottom, rgba(0,0,0,0), rgba(0,0,0,0.5)), 
                        url('https://images.unsplash.com/photo-1557683316-973673baf926?q=80&w=1000&auto=format&fit=crop'); /* Cover Photo URL */
            background-size: cover;
            background-position: center;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        .profile-img-container {
            position: relative;
            margin-top: -55px; /* Profile picture overlap with cover */
        }

        .profile-img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            border: 4px solid #050708; /* Border around profile pic */
            object-fit: cover;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }

        /* --- Content Styling --- */
        .section-content {
            padding: 0 20px;
            text-align: center;
        }

        h1 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
        p { color: rgba(255, 255, 255, 0.5); font-size: 14px; max-width: 300px; line-height: 1.5; margin: 0 auto; }

        /* Icons for other sections */
        .big-icon {
            font-size: 60px;
            margin-top: 100px;
            margin-bottom: 20px;
            color: #ffffff;
        }

        /* --- Navigation --- */
        .nav-wrapper {
            position: fixed;
            bottom: 35px;
            left: 0; right: 0;
            display: flex; justify-content: center;
            z-index: 1000;
        }

        .nav-bar {
            display: flex;
            background: rgba(255, 255, 255, 0.04);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            padding: 6px;
            border-radius: 100px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            gap: 4px;
        }

        .nav-item {
            position: relative;
            display: flex; align-items: center;
            padding: 10px 18px;
            border-radius: 100px;
            cursor: pointer;
            color: rgba(255, 255, 255, 0.4);
            transition: all 0.3s ease;
        }

        .nav-item.active { color: #000; }
        .nav-item.active::before {
            content: '';
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: #ffffff;
            border-radius: 100px;
            z-index: -1;
        }

        .nav-item i { font-size: 22px; }
        .nav-item span {
            font-size: 14px; font-weight: 700;
            width: 0; opacity: 0; overflow: hidden;
            transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        .nav-item.active span { width: 45px; margin-left: 8px; opacity: 1; }

    </style>
</head>
<body>

    <div class="content-wrapper">
        <section id="home" class="section active">
            <div class="profile-header">
                <div class="cover-photo"></div>
                <div class="profile-img-container">
                    <img src="https://via.placeholder.com/150" class="profile-img">
                </div>
            </div>
            <div class="section-content">
                <h1>Eiroko Profile</h1>
                <p>আমি একজন ডেভেলপার। আমার এই সেকশনটি একদম ফেসবুকের স্টাইলে কভার ফটো সহ সাজানো হয়েছে।</p>
            </div>
        </section>

        <section id="exe" class="section">
            <i class='bx bx-terminal big-icon'></i>
            <h1>Software EXE</h1>
            <p>আপনার সকল কম্পিউটার ফাইল এখানে পাবেন।</p>
        </section>

        <section id="files" class="section">
            <i class='bx bx-folder big-icon'></i>
            <h1>File Manager</h1>
            <p>সব ডাটা সেভ থাকবে কোনো রিলোড ছাড়াই।</p>
        </section>

        <section id="chat" class="section">
            <i class='bx bx-message-square-dots big-icon'></i>
            <h1>Chat Box</h1>
            <p>রিয়েল টাইম চ্যাটিং এক্সপেরিয়েন্স।</p>
        </section>
    </div>

    <div class="nav-wrapper">
        <nav class="nav-bar">
            <div class="nav-item active" onclick="navTo('home', this)">
                <i class='bx bx-home-alt-2'></i>
                <span>Home</span>
            </div>
            <div class="nav-item" onclick="navTo('exe', this)">
                <i class='bx bx-terminal'></i>
                <span>EXE</span>
            </div>
            <div class="nav-item" onclick="navTo('files', this)">
                <i class='bx bx-folder'></i>
                <span>Files</span>
            </div>
            <div class="nav-item" onclick="navTo('chat', this)">
                <i class='bx bx-message-square-dots'></i>
                <span>Chat</span>
            </div>
        </nav>
    </div>

    <script>
        function navTo(id, el) {
            const currentNav = document.querySelector('.nav-item.active');
            const currentSec = document.querySelector('.section.active');
            const targetSec = document.getElementById(id);

            if (currentNav === el) return;

            currentNav.classList.remove('active');
            el.classList.add('active');

            currentSec.classList.remove('active');
            // Small delay for smooth entry
            setTimeout(() => {
                targetSec.classList.add('active');
            }, 50);
        }
    </script>

</body>
</html>
