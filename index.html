<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Personal Profile</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: url('https://images.unsplash.com/photo-1618005182384-a83a8bd57fbe?auto=format&fit=crop&w=1920&q=80') no-repeat center center/cover;
            padding: 20px;
        }

        /* মেইন কার্ড ডিজাইন */
        .profile-card {
            width: 100%;
            max-width: 400px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.25);
            border-radius: 30px;
            padding: 40px 30px;
            text-align: center;
            color: #fff;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
        }

        /* প্রোফাইল পিকচার */
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 4px solid rgba(255, 255, 255, 0.3);
            margin-bottom: 20px;
            object-fit: cover;
            box-shadow: 0 10px 20px rgba(0,0,0,0.2);
        }

        h1 {
            font-size: 24px;
            margin-bottom: 10px;
            letter-spacing: 1px;
        }

        p.bio {
            font-size: 14px;
            opacity: 0.8;
            margin-bottom: 30px;
        }

        /* কন্টাক্ট লিঙ্ক বাটন */
        .social-links {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .link-item {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 15px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 15px;
            color: #fff;
            text-decoration: none;
            font-weight: 500;
            transition: all 0.3s ease;
        }

        .link-item i {
            font-size: 20px;
        }

        /* হোভার ইফেক্ট */
        .link-item:hover {
            background: rgba(255, 255, 255, 0.25);
            transform: scale(1.05);
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* প্রতিটি প্ল্যাটফর্মের জন্য আলাদা টাচ */
        .whatsapp:hover { border-color: #25D366; color: #25D366; }
        .telegram:hover { border-color: #0088cc; color: #0088cc; }
        .facebook:hover { border-color: #1877F2; color: #1877F2; }

    </style>
</head>
<body>

    <div class="profile-card">
        <img src="profile.jpg" alt="Your Name" class="profile-img">
        
        <h1>আপনার নাম এখানে</h1>
        <p class="bio">Web Developer | Guitarist | Rider</p>

        <div class="social-links">
            <a href="https://wa.me/YOUR_NUMBER" class="link-item whatsapp" target="_blank">
                <i class="fab fa-whatsapp"></i> WhatsApp
            </a>

            <a href="https://t.me/YOUR_USERNAME" class="link-item telegram" target="_blank">
                <i class="fab fa-telegram-plane"></i> Telegram
            </a>

            <a href="https://facebook.com/YOUR_PROFILE" class="link-item facebook" target="_blank">
                <i class="fab fa-facebook-f"></i> Facebook
            </a>
        </div>
    </div>

</body>
</html>
