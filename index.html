<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FF Sensi Finder | Get Best Sensitivity</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>FF Sensi <span class="highlight">Finder</span></h1>
        <p>Select your phone model to get the best headshot sensitivity.</p>

        <div class="search-box">
            <select id="phoneBrand" onchange="getSensi()">
                <option value="">Select Phone Brand</option>
                <option value="iphone">iPhone (All Models)</option>
                <option value="samsung">Samsung</option>
                <option value="xiaomi">Xiaomi / Poco</option>
                <option value="vivo">Vivo / Oppo</option>
                <option value="realme">Realme</option>
                <option value="lowend">2GB/3GB RAM Phone</option>
            </select>
        </div>

        <div id="result" class="result-card" style="display: none;">
            <div class="sensi-grid">
                <div class="sensi-item"><span>General</span> <b id="gen">0</b></div>
                <div class="sensi-item"><span>Red Dot</span> <b id="red">0</b></div>
                <div class="sensi-item"><span>2x Scope</span> <b id="scope2">0</b></div>
                <div class="sensi-item"><span>4x Scope</span> <b id="scope4">0</b></div>
                <div class="sensi-item"><span>Sniper</span> <b id="sniper">0</b></div>
                <div class="sensi-item"><span>Free Look</span> <b id="free">0</b></div>
            </div>
            <button class="btn-copy" onclick="copyAlert()">Copy Settings</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
