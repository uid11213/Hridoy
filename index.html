<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eiroko UI - Clean Design</title>
    <link href='https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css' rel='stylesheet'>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', sans-serif;
        }

        body {
            background-color: #f2f2f2;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* --- Main Nav Bar --- */
        .nav-bar {
            display: flex;
            align-items: center;
            background: rgba(255, 255, 255, 0.5);
            backdrop-filter: blur(10px);
            padding: 8px;
            border-radius: 50px;
            border: 1px solid rgba(255, 255, 255, 0.8);
            gap: 5px;
        }

        /* --- Default Nav Item --- */
        .nav-item {
            display: flex;
            align-items: center;
            padding: 12px 18px;
            border-radius: 40px;
            cursor: pointer;
            color: #555;
            transition: 0.2s ease; /* Khub e halka transition fast feel er jonno */
            text-decoration: none;
        }

        .nav-item i {
            font-size: 24px;
        }

        .nav-item span {
            font-size: 16px;
            font-weight: 600;
            margin-left: 10px;
            display: none; /* Default e shudhu icon thakbe */
        }

        /* --- Active State (Image er moto) --- */
        .nav-item.active {
            background: #ffffff;
            color: #000;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.03);
        }

        .nav-item.active span {
            display: inline-block; /* Active holei kebol text dekhabe */
        }

        /* Hover Effect */
        .nav-item:hover:not(.active) {
            background: rgba(255, 255, 255, 0.3);
        }

    </style>
</head>
<body>

    <nav class="nav-bar">
        <div class="nav-item active" onclick="setActive(this)">
            <i class='bx bx-home-alt-2'></i>
            <span>Home</span>
        </div>

        <div class="nav-item" onclick="setActive(this)">
            <i class='bx bx-list-check'></i>
            <span>Tasks</span>
        </div>

        <div class="nav-item" onclick="setActive(this)">
            <i class='bx bx-folder'></i>
            <span>Files</span>
        </div>

        <div class="nav-item" onclick="setActive(this)">
            <i class='bx bx-message-square-detail'></i>
            <span>Chat</span>
        </div>
    </nav>

    <script>
        function setActive(el) {
            // Agekar active class remove kora
            const items = document.querySelectorAll('.nav-item');
            items.forEach(item => item.classList.remove('active'));
            
            // Notun element e active class add kora
            el.classList.add('active');
        }
    </script>

</body>
</html>
